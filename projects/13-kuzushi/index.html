    <style>
      /* ---------- Farben & Grundlagen ---------- */
      :root {
        --bg: #0d0d0f;
        --ink: #f4f1ec;
        --mute: #8d8a86;
        --red: #cf1830;
        --amber: #ffb020;
        --ok: #2ee07a;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--ink);
        font-family: "Archivo", system-ui, sans-serif;
        user-select: none; -webkit-user-select: none;
        touch-action: none; overscroll-behavior: none;
      }
      canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .display { font-family: "Archivo Black", "Archivo", sans-serif; text-transform: uppercase; letter-spacing: -0.01em; }

      /* ---------- Modus-Umschalter (gleich in allen drei Seiten) ---------- */
      .modes {
        position: fixed; left: 50%; top: calc(12px + var(--safe-top)); transform: translateX(-50%); z-index: 6;
        display: flex; padding: 4px; border-radius: 4px; background: #1d1d22;
      }
      .modes a {
        padding: 8px 14px; border-radius: 3px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--mute); text-decoration: none; white-space: nowrap;
      }
      .modes a[aria-current="page"] { background: var(--red); color: #fff; }
      .modes a:not([aria-current]):hover { color: var(--ink); }

      /* ---------- Satz oben (max. ein Satz pro Screen) ---------- */
      #kicker {
        position: fixed; left: 20px; bottom: calc(20px + var(--safe-bottom));
        font-weight: 700; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute);
      }
      #kicker b { color: var(--red); }
      #say {
        position: fixed; left: 16px; right: 16px; top: calc(70px + var(--safe-top));
        text-align: center; font-weight: 700; line-height: 1.12;
        font-size: clamp(24px, 4.2vw, 44px); pointer-events: none; text-wrap: balance;
      }
      #say em { font-style: normal; color: var(--amber); }

      /* ---------- Knöpfe ---------- */
      button { font-family: inherit; cursor: pointer; border: 0; }
      .btn {
        background: var(--red); color: #fff; font-family: "Archivo Black", sans-serif; text-transform: uppercase;
        font-size: clamp(18px, 3vw, 24px); letter-spacing: 0.04em; padding: 18px 40px; border-radius: 4px;
        box-shadow: 0 0 0 0 rgba(207, 24, 48, 0.6); transition: transform 0.12s, background 0.2s;
      }
      .btn:hover { background: #e01d37; }
      .btn:active { transform: scale(0.96); }
      #action {
        position: fixed; left: 50%; bottom: calc(30px + var(--safe-bottom));
        transform: translateX(-50%); opacity: 0; pointer-events: none; z-index: 3;
      }
      #sound {
        position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(12px + var(--safe-top));
        width: 48px; height: 48px; border-radius: 50%; background: #1d1d22; color: var(--ink);
        font-size: 20px; z-index: 5;
      }

      /* ---------- Karte (Start, Fragen, Merksatz) ---------- */
      #card {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 4;
        background: rgba(13, 13, 15, 0.78); backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px); opacity: 0; pointer-events: none;
      }
      #card .inner { text-align: center; padding: 16px; max-width: 980px; }
      #card .k { font-weight: 700; font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--red); margin-bottom: 14px; }
      #card h1 {
        margin: 0 0 18px; line-height: 0.95; white-space: pre-line;
        font-size: clamp(48px, 11vw, 140px); text-wrap: balance;
      }
      #card h1.long { font-size: clamp(32px, 6vw, 76px); line-height: 1.02; }
      #card p {
        margin: 0 auto 34px; font-weight: 500; line-height: 1.25; max-width: 640px;
        font-size: clamp(20px, 3.4vw, 30px); text-wrap: balance; color: #d8d4ce;
      }

      /* ---------- Großer Treffer-Schriftzug ---------- */
      #flash {
        position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 2;

      #vignette {
        position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 1;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(207,24,48,0.55) 100%);

      /* ---------- Hinweise & HUD ---------- */
      #hint {
        position: fixed; font-family: "Archivo Black", sans-serif; font-size: clamp(28px, 4vw, 44px);
        color: var(--ink); pointer-events: none; opacity: 0; transform: translate(-50%, -50%); white-space: nowrap; z-index: 2;

        text-transform: uppercase; background: var(--ink); color: var(--bg); pointer-events: none; opacity: 0;
        transform: translate(-50%, -50%); white-space: nowrap; z-index: 2;
      }
      #hud {
        position: fixed; left: 50%; bottom: calc(26px + var(--safe-bottom)); transform: translateX(-50%);
        display: flex; gap: 10px; opacity: 0; pointer-events: none;
      }
      #hud div {
        width: clamp(96px, 22vw, 150px); padding: 10px 8px; border: 2px solid #2b2b31; border-radius: 4px; text-align: center;
      }
      #hud div b { display: block; font-family: "Archivo Black", sans-serif; text-transform: uppercase; font-size: 18px; }
      #hud div span { font-size: 14px; color: var(--mute); }
      #hud div.done { border-color: var(--red); }

    <div id="card"><div class="inner">
      <div class="k"></div>
      <h1 class="display"></h1>
      <p></p>
      <button class="btn"></button>
    </div></div>

    <script type="module">
      import * as THREE from "three";

      /* =====================================================================
         KUZUSHI · Teens
         Ein Satz: „Gegen seine Kraft: schwer. Mit seiner Kraft: leicht.“

         Gleiche Physik wie „Der Fels“ (Kippblock um die Fußkante), plus:
         - Der Gegner steht in Schrittstellung (vorne/hinten = x-Achse) und blickt zu dir (−x).
         - Er kann seinen Oberkörper verlagern: Versatz c des Schwerpunkts über der Basis.
           Zur Seite, zu der er sich lehnt, wird seine Basis schmal:  b = bx − sgn·c
         - Er reagiert wie ein echter Gegner: Drückst du, lehnt er sich gegen dich (c < 0),
           sobald er wieder stabil steht. Ziehst du, setzt er sich zurück (c > 0).
         - Gegen deine Kraft fängt er sich (Fang-Reflex). Gehst du MIT seiner Lehne,
           ist seine Kugel schon fast über der Kante: ein kleiner Zug reicht.
         ===================================================================== */

      // ---------- Einstellungen ----------
      const G = 9.81;
      const THIGH = 0.75;
      const STANCE_W = 1.1;       // Schrittlänge (vorne ↔ hinten)
      const STANCE_T = 0.6;       // Hüfthöhe 0 = tief … 1 = hoch
      const MIN_HIP = 0.72;
      const FOOT_HALF_X = 0.27;   // halbe Fußlänge (Füße zeigen zu dir)
      const FOOT_Z = 0.16;        // Füße leicht versetzt in der Tiefe
      const COM_ABOVE_HIP = 0.45;
      const K = 1.1;              // Kraft-Faktor deiner Aktion
      const LEAN = 0.7;           // wie weit er sich maximal verlagert
      const REACT_DELAY = 0.28;   // Reaktionszeit (Sekunden Spielzeit)
      const HOLD = 1.4;           // so lange hält er die Lehne
      const MAX_S = 1.6;          // maximale Wisch-Stärke
      const COLORS = {
        bg: 0x0d0d0f, mat: 0x1c1c21, matBorder: 0xcf1830, gi: 0xf2f0ec,
        skin: 0xc9c5bf, belt: 0x111111, ok: 0x2ee07a, warn: 0xffb020, out: 0xcf1830,
      };

      // ---------- Renderer, Szene, Kamera ----------
      const canvas = document.getElementById("scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(COLORS.bg);
      scene.fog = new THREE.Fog(COLORS.bg, 12, 26);

      const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
      const camLook = new THREE.Vector3(0, 1.3, 0);
      const shake = { amp: 0 };

      scene.add(new THREE.HemisphereLight(0xffffff, 0x221014, 0.9));
      const key = new THREE.SpotLight(0xffffff, 120, 30, 0.5, 0.6, 1.4);
      key.position.set(-3, 9, 5);
      key.target.position.set(0, 1, 0);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      scene.add(key, key.target);
      const rim = new THREE.DirectionalLight(0xff2a45, 2.4); // rotes Gegenlicht
      rim.position.set(4, 4, -6);
      scene.add(rim);

      // ---------- Matte ----------
      const mat = new THREE.Mesh(
        new THREE.BoxGeometry(16, 0.3, 9),
        new THREE.MeshStandardMaterial({ color: COLORS.matBorder, roughness: 0.85 })
      );
      mat.position.y = -0.15;
      mat.receiveShadow = true;
      scene.add(mat);
      const matInner = new THREE.Mesh(
        new THREE.PlaneGeometry(14, 7),
        new THREE.MeshStandardMaterial({ color: COLORS.mat, roughness: 0.95 })
      );
      matInner.rotation.x = -Math.PI / 2;
      matInner.position.y = 0.001;
      matInner.receiveShadow = true;
      scene.add(matInner);

      // ---------- Basis-Fläche (bleibt am Boden) ----------
      function rectTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const g = c.getContext("2d");
        g.beginPath();
        g.roundRect(8, 8, 240, 240, 26);
        g.fillStyle = "rgba(255,255,255,0.22)";
        g.fill();
        g.lineWidth = 10;
        g.strokeStyle = "rgba(255,255,255,1)";
        g.stroke();
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }
      const baseMat = new THREE.MeshBasicMaterial({ map: rectTexture(), color: COLORS.ok, transparent: true, depthWrite: false });
      const basePlate = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), baseMat);
      basePlate.rotation.x = -Math.PI / 2;
      basePlate.position.y = 0.01;
      scene.add(basePlate);

      // Staub-Ring beim Aufprall
      const dust = new THREE.Mesh(
        new THREE.RingGeometry(0.6, 0.75, 48),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false })
      );
      dust.rotation.x = -Math.PI / 2;
      dust.position.y = 0.02;
      scene.add(dust);

      // ---------- Der Gegner (gesichtslose Low-Poly-Puppe im Gi) ----------
      const toon = (color, rough = 0.6) => new THREE.MeshStandardMaterial({ color, roughness: rough, flatShading: true });
      const mGi = toon(COLORS.gi), mSkin = toon(COLORS.skin, 0.4), mBelt = toon(COLORS.belt, 0.8);
      const ico = (r, d = 1) => new THREE.IcosahedronGeometry(r, d);
      const shadowy = (m) => ((m.castShadow = true), m);

      const figure = new THREE.Group();
      figure.matrixAutoUpdate = false;
      scene.add(figure);

      // Oberkörper: verschiebt sich um c und neigt sich (seine Reaktion)
      const upper = new THREE.Group();
      figure.add(upper);
      const torso = shadowy(new THREE.Mesh(ico(1, 2), mGi));
      torso.scale.set(0.46, 0.64, 0.58);
      torso.position.y = 0.42;
      upper.add(torso);
      // Revers als dunkle Kante
      const lapel = shadowy(new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.6, 0.08), toon(0xd8d4cc)));
      lapel.position.set(-0.43, 0.6, 0.06);
      lapel.rotation.x = 0.35;
      upper.add(lapel);
      const belt = shadowy(new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.07, 6, 20), mBelt));
      belt.rotation.x = Math.PI / 2;
      belt.scale.set(0.86, 1.08, 1);
      belt.position.y = 0.2;
      upper.add(belt);
      const knot = shadowy(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.26, 0.12), mBelt));
      knot.position.set(-0.44, 0.08, 0.1);
      knot.rotation.x = 0.3;
      upper.add(knot);
      const head = shadowy(new THREE.Mesh(ico(0.38, 2), mSkin));
      head.position.set(-0.04, 1.2, 0);
      upper.add(head);
      // Griffpunkt am Revers – hier ziehst/drückst du
      const gripAnchor = new THREE.Object3D();
      gripAnchor.position.set(-0.47, 0.82, 0.14);
      upper.add(gripAnchor);

      // Arme greifen nach vorne zu dir
      const arms = [-1, 1].map((s) => {
        const pivot = new THREE.Group();
        pivot.position.set(-0.05, 0.76, s * 0.55);
        const arm = shadowy(new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.42, 3, 8), mGi));
        arm.position.y = -0.26;
        const hand = shadowy(new THREE.Mesh(ico(0.11, 1), mSkin));
        hand.position.y = -0.56;
        pivot.add(arm, hand);
        pivot.rotation.z = -1.0;
        upper.add(pivot);
        return pivot;
      });

      // Beine (2-Knochen-IK): vorderes Bein zu dir (−x), hinteres weg (+x)
      const limbGeo = new THREE.CylinderGeometry(1, 1, 1, 8);
      const legs = [-1, 1].map((s) => {
        const thigh = shadowy(new THREE.Mesh(limbGeo, mGi));
        const shin = shadowy(new THREE.Mesh(limbGeo, mGi));
        thigh.scale.set(0.15, 1, 0.15);
        shin.scale.set(0.12, 1, 0.12);
        const knee = shadowy(new THREE.Mesh(ico(0.14, 1), mGi));
        const foot = shadowy(new THREE.Mesh(ico(1, 1), mSkin));
        foot.scale.set(FOOT_HALF_X, 0.09, 0.13);
        figure.add(thigh, shin, knee, foot);
        return { s, thigh, shin, knee, foot };
      });

      const UP = new THREE.Vector3(0, 1, 0);
      const tmpC = new THREE.Vector3();
      const hipY = (() => {
        const maxHip = Math.sqrt((2 * THIGH * 0.97) ** 2 - (STANCE_W / 2) ** 2);
        return THREE.MathUtils.lerp(MIN_HIP, maxHip, STANCE_T);
      })();
      const BX = STANCE_W / 2 + FOOT_HALF_X;   // halbe Basis vorne/hinten
      const BZ = FOOT_Z + 0.13;                // halbe Basis seitlich (nur Anzeige)
      const H = hipY + COM_ABOVE_HIP;          // Schwerpunkt-Höhe

      function placeLimb(mesh, a, b) {
        mesh.position.copy(a).add(b).multiplyScalar(0.5);
        tmpC.copy(b).sub(a);
        mesh.scale.y = tmpC.length();
        mesh.quaternion.setFromUnitVectors(UP, tmpC.normalize());
      }
      // Beine einmal aufbauen (die Haltung ist fest; er arbeitet mit dem Oberkörper)
      upper.position.y = hipY;
      for (const L of legs) {
        const Hp = new THREE.Vector3(0, hipY, L.s * -0.2);
        const F = new THREE.Vector3(L.s * STANCE_W / 2, 0.12, L.s * -FOOT_Z);
        const d = Hp.distanceTo(F);
        const u = F.clone().sub(Hp).normalize();
        const v = new THREE.Vector3(-1, 0, 0);
        v.addScaledVector(u, -v.dot(u)).normalize();
        const Kp = Hp.clone().add(F).multiplyScalar(0.5).addScaledVector(v, Math.sqrt(Math.max(0, THIGH * THIGH - (d / 2) ** 2)));
        placeLimb(L.thigh, Hp, Kp);
        placeLimb(L.shin, Kp, F);
        L.knee.position.copy(Kp);
        L.foot.position.set(L.s * STANCE_W / 2 - 0.06, 0.08, L.s * -FOOT_Z);
      }
      basePlate.scale.set(BX * 2, BZ * 2, 1);

      // ---------- Physik + Gegner-Reaktion ----------
      const phys = {
        phi: 0, w: 0, c: 0, lie: Math.PI / 2,
        fallen: false, frozen: false, lost: false, timeScale: 1, t: 0,
      };
      // Gegner-Zustand: idle → delay → hold → recover → idle  (lost = ausgehebelt)
      const ai = { phase: "idle", timer: 0, ldir: 0, target: 0, lastLeanAct: -9 };

      function resetAI() {
        Object.assign(ai, { phase: "idle", timer: 0, ldir: 0, target: 0, lastLeanAct: -9 });
      }

      function updateAI(dt) {
        if (ai.phase === "lost") return;
        ai.timer -= dt;
        if (ai.phase === "delay" && ai.timer <= 0 && Math.abs(phys.phi) < 0.03 && Math.abs(phys.w) < 0.15) {
          // Er steht wieder stabil → jetzt lehnt er sich gegen dich
          ai.phase = "hold";
          ai.timer = HOLD;
          ai.target = ai.ldir * LEAN;
        } else if (ai.phase === "hold" && ai.timer <= 0) {
          ai.phase = "recover";
          ai.timer = 0.6;
          ai.target = 0;
        } else if (ai.phase === "recover" && ai.timer <= 0) {
          ai.phase = "idle";
        }
        phys.c += (ai.target - phys.c) * (1 - Math.exp(-dt * 7));
      }

      // Halbe Basis zur Seite sgn (−1 = zu dir, +1 = weg von dir)
      const sideB = (sgn) => BX - sgn * phys.c;

      function lieAngle(b) {
        const yT = hipY + 0.42, yH = hipY + 1.2;
        const alpha = Math.atan2(b, H);
        for (let a = alpha; a < Math.PI / 2; a += 0.005) {
          const s = Math.sin(a), c = Math.cos(a);
          if (BX * s + yT * c <= 0.48 || BX * s + yH * c <= 0.38) return a;
        }
        return Math.PI / 2;
      }

      function stepOnce(dt) {
        updateAI(dt);
        const sg = Math.sign(phys.phi || phys.w);
        if (!sg) return;
        const b = Math.max(0.02, sideB(sg));
        const R = Math.hypot(b, H), alpha = Math.atan2(b, H);
        const p2 = (3 * G) / (4 * R);
        phys.w += -p2 * Math.sin(alpha * sg - phys.phi) * dt;
        phys.w *= 1 - 0.8 * dt;
        // Fang-Reflex: Gegen deine Kraft fängt er sich – solange du nicht MIT ihm gehst
        if (!phys.lost && Math.abs(phys.c) > 0.1 && Math.sign(phys.c) === sg && phys.t - ai.lastLeanAct > 0.7) {
          phys.w *= 1 - 6 * dt;
        }
        const next = phys.phi + phys.w * dt;
        if (phys.phi !== 0 && Math.sign(next) !== Math.sign(phys.phi)) {
          phys.w *= Math.max(0.5, 1 - 1.5 * Math.sin(alpha) ** 2);
        }
        phys.phi = next;
        if (Math.abs(phys.phi) < 0.003 && Math.abs(phys.w) < 0.05) phys.phi = phys.w = 0;
        // Punkt ohne Rückkehr: Kugel ist über der Kante
        if (!phys.lost && Math.abs(phys.phi) > alpha) onLost(sg);
        if (Math.abs(phys.phi) >= phys.lie) land();
      }

      function stepPhysics(dt) {
        if (phys.fallen || phys.frozen) return;
        const n = Math.ceil(dt / (1 / 300));
        for (let i = 0; i < n && !phys.fallen; i++) {
          phys.t += dt / n;
          runReplayQueue();
          stepOnce(dt / n);
        }
      }

      // Deine Aktion: dir +1 = drücken (weg von dir), −1 = ziehen (zu dir)
      let lastAction = null;
      function act(dir, s, { record = true } = {}) {
        const b = sideB(dir);
        phys.w += dir * K * s * H / (b * b + H * H);
        // Gehst du in seine Lehn-Richtung, ist das MIT seiner Kraft
        if (dir === ai.ldir && ai.phase !== "idle") ai.lastLeanAct = phys.t;
        if (ai.phase === "idle" || ai.phase === "recover" || dir === -ai.ldir) {
          ai.phase = "delay";
          ai.timer = REACT_DELAY;
          ai.ldir = -dir;
        }
        lastAction = { dir, s, c: phys.c, t: phys.t };
        if (record) attempt.actions.push({ dir, s, t: phys.t });
        attempt.lastT = phys.t;
        showForce(dir, s);
        sfx.grip(dir, s);
      }

      function onLost(sg) {
        phys.lost = true;
        ai.phase = "lost";
        phys.w += sg * 0.6; // er gibt auf – Fall nimmt Fahrt auf
        phys.lie = lieAngle(BX);
        hooks.onLost?.(sg);
      }

      function land() {
        phys.phi = Math.sign(phys.phi) * phys.lie;
        phys.w = 0;
        phys.fallen = true;
        shake.amp = 0.28;
        sfx.thud();
        const p = toGround(comWorld);
        dust.position.set(p.x, 0.02, p.z);
        gsap.fromTo(dust.scale, { x: 0.4, y: 0.4, z: 0.4 }, { x: 3.2, y: 3.2, z: 3.2, duration: 0.9, ease: "power2.out" });
        gsap.fromTo(dust.material, { opacity: 0.6 }, { opacity: 0, duration: 0.9 });
        hooks.onLand?.();
      }
      const toGround = (v) => ({ x: v.x, z: v.z });

      function standUp(duration = 0.9) {
        return new Promise((resolve) => {
          phys.frozen = true;
          phys.w = 0;
          gsap.to(phys, {
            phi: 0, c: 0, duration, ease: "power3.inOut",
            onComplete: () => {
              Object.assign(phys, { phi: 0, w: 0, c: 0, fallen: false, frozen: false, lost: false, lie: Math.PI / 2 });
              resetAI();
              resolve();
            },
          });
        });
      }

      // ---------- Wiederholung in Zeitlupe ----------
      let replayQueue = null;
      function runReplayQueue() {
        if (!replayQueue) return;
        while (replayQueue.items.length && phys.t - replayQueue.t0 >= replayQueue.items[0].t) {
          const a = replayQueue.items.shift();
          act(a.dir, a.s, { record: false });
        }
      }
      async function replay(actions, scale = 0.35) {
        await standUp(0.6);
        const t0 = actions[0]?.t ?? 0;
        replayQueue = { t0: phys.t, items: actions.map((a) => ({ ...a, t: a.t - t0 })) };
        const end = phys.t + (actions.at(-1).t - t0) + 2.4;
        gsap.to(phys, { timeScale: scale, duration: 0.2 });
        await until(() => phys.fallen || phys.t > end);
        replayQueue = null;
        gsap.to(phys, { timeScale: 1, duration: 0.5 });
      }

      // ---------- Figur um die Kippkante drehen ----------
      const mT = new THREE.Matrix4(), mR = new THREE.Matrix4();
      function updateFigure() {
        const px = Math.sign(phys.phi) * BX;
        figure.matrix.makeTranslation(px, 0, 0).multiply(mR.makeRotationZ(-phys.phi)).multiply(mT.makeTranslation(-px, 0, 0));
        figure.matrixWorldNeedsUpdate = true;
        // Seine Lehne: Oberkörper verschiebt sich und neigt sich
        upper.position.x = phys.c * 0.7;
        upper.rotation.z = -phys.c * 0.42;
        arms.forEach((a, i) => (a.rotation.z = -1.0 - phys.c * 0.5 + Math.sin(phys.t * 2 + i) * 0.03));
      }

      // ---------- Schwerpunkt-Kugel, Lot-Linie, Bodenpunkt ----------
      const glowTex = (() => {
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const g = c.getContext("2d");
        const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        grd.addColorStop(0, "rgba(255,255,255,1)");
        grd.addColorStop(0.3, "rgba(255,255,255,0.4)");
        grd.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = grd;
        g.fillRect(0, 0, 128, 128);
        return new THREE.CanvasTexture(c);
      })();
      const comBall = new THREE.Mesh(new THREE.SphereGeometry(0.12, 20, 14), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false }));
      comBall.renderOrder = 10;
      const comGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, depthTest: false, blending: THREE.AdditiveBlending, transparent: true }));
      comGlow.renderOrder = 9;
      scene.add(comBall, comGlow);
      const dotMat = new THREE.MeshBasicMaterial({ color: COLORS.ok, depthTest: false, transparent: true });
      const dotGeo = new THREE.SphereGeometry(0.04, 8, 6);
      const dots = Array.from({ length: 18 }, () => {
        const d = new THREE.Mesh(dotGeo, dotMat);
        d.renderOrder = 8;
        scene.add(d);
        return d;
      });
      const groundRing = new THREE.Mesh(new THREE.RingGeometry(0.09, 0.16, 24), new THREE.MeshBasicMaterial({ color: COLORS.ok, depthTest: false }));
      groundRing.rotation.x = -Math.PI / 2;
      groundRing.renderOrder = 8;
      scene.add(groundRing);

      const comWorld = new THREE.Vector3();
      const cOk = new THREE.Color(COLORS.ok), cWarn = new THREE.Color(COLORS.warn), cOut = new THREE.Color(COLORS.out);
      const tmpCol = new THREE.Color();
      let zone = "ok"; // ok | warn | out

      function updateIndicator(time) {
        comWorld.set(phys.c, H, 0).applyMatrix4(figure.matrix);
        comBall.position.copy(comWorld);
        comGlow.position.copy(comWorld);
        const pulse = 1 + Math.sin(time * 6) * 0.08;
        comGlow.scale.setScalar(0.9 * pulse);
        // Wie nah ist die Projektion an der Kante? (Basis bleibt am Boden)
        const margin = 1 - Math.abs(comWorld.x) / BX;
        zone = margin < 0 ? "out" : margin < 0.4 ? "warn" : "ok";
        const col = zone === "out" ? cOut : zone === "warn" ? cWarn : cOk;
        tmpCol.copy(col);
        dotMat.color.copy(tmpCol);
        groundRing.material.color.copy(tmpCol);
        baseMat.color.lerp(tmpCol, 0.25);
        comBall.material.color.lerp(zone === "ok" ? new THREE.Color(0xffffff) : tmpCol, 0.3);
        dots.forEach((d, i) => d.position.set(comWorld.x, comWorld.y * (1 - (i + 0.5) / dots.length), comWorld.z));
        groundRing.position.set(comWorld.x, 0.02, comWorld.z);
      }

      // ---------- Dein Griff: rote Linie von links an sein Revers ----------
      const gripMat = new THREE.MeshStandardMaterial({ color: COLORS.out, emissive: COLORS.out, emissiveIntensity: 0.6, roughness: 0.4 });
      const gripLine = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 10), gripMat);
      const gripHand = new THREE.Mesh(ico(0.13, 1), gripMat);
      scene.add(gripLine, gripHand);
      const gripWorld = new THREE.Vector3(), gripStart = new THREE.Vector3();
      const gripPulse = { v: 0 };
      function updateGrip() {
        figure.updateMatrixWorld(true);
        gripAnchor.getWorldPosition(gripWorld);
        gripStart.set(-9, gripWorld.y * 0.9 + 0.2, 0.3);
        placeLimb(gripLine, gripStart, gripWorld);
        const r = 1 + gripPulse.v;
        gripLine.scale.x = gripLine.scale.z = r;
        gripHand.position.copy(gripWorld);
        gripHand.scale.setScalar(r);
        gripMat.emissiveIntensity = 0.5 + gripPulse.v * 3;
      }

      // Kraft-Pfeil + Prozent am Griff
      const forceEl = document.getElementById("force");
      function showForce(dir, s) {
        gsap.fromTo(gripPulse, { v: 0.8 * (s / MAX_S) + 0.2 }, { v: 0, duration: 0.6, ease: "power2.out" });
        const p = toScreen(gripWorld);
        forceEl.textContent = (dir > 0 ? "→ " : "← ") + Math.round((s / MAX_S) * 100) + " %";
        forceEl.style.color = dir > 0 ? "#f4f1ec" : "#ffb020";
        gsap.killTweensOf(forceEl);
        gsap.fromTo(forceEl, { opacity: 1, left: p.x, top: p.y - 50 }, { opacity: 0, left: p.x + dir * 60, top: p.y - 80, duration: 1.1, ease: "power2.out" });
      }

      // ---------- Kamera ----------
      let camDist = 10;
      function resize() {
        const w = innerWidth, h = innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camDist = THREE.MathUtils.clamp(Math.max(9.5, 8.6 / camera.aspect), 9.5, 18);
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);
      resize();

      const toScreen = (v) => {
        const p = v.clone().project(camera);
        return { x: (p.x * 0.5 + 0.5) * innerWidth, y: (-p.y * 0.5 + 0.5) * innerHeight };
      };

      // ---------- Ton & Sprache ----------
      let speechOn = false;
      let actx = null;
      const ensureAudio = () => {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === "suspended") actx.resume();
      };
      function noise(dur, freq, vol) {
        if (!actx) return;
        const len = Math.floor(actx.sampleRate * dur);
        const buf = actx.createBuffer(1, len, actx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2;
        const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
        src.buffer = buf;
        f.type = "lowpass";
        f.frequency.value = freq;
        g.gain.value = vol;
        src.connect(f).connect(g).connect(actx.destination);
        src.start();
      }
      function tone(type, f0, f1, dur, vol) {
        if (!actx) return;
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
        o.type = type;
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(actx.destination);
        o.start(t);
        o.stop(t + dur);
      }
      const sfx = {
        grip: (dir, s) => noise(0.12, dir > 0 ? 900 : 1600, 0.15 + 0.15 * (s / MAX_S)), // Gi-Stoff
        lost: () => tone("sine", 90, 40, 0.8, 0.25),
        thud: () => { tone("sine", 110, 35, 0.5, 0.6); noise(0.3, 400, 0.5); },
        ding: () => tone("triangle", 1046, 1046, 0.35, 0.12),
      };

      let voice = null;
      const pickVoice = () => {
        const vs = speechSynthesis.getVoices();
        voice = vs.find((v) => v.lang === "de-DE" && /Google|Markus|Yannick|Anna/.test(v.name)) || vs.find((v) => v.lang.startsWith("de")) || null;
      };
      if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
      function speak(text) {
        if (!speechOn || !("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/[–:]/g, ","));
        u.lang = "de-DE";
        if (voice) u.voice = voice;
        u.rate = 1.02;
        speechSynthesis.speak(u);
      }
      const soundBtn = document.getElementById("sound");
      soundBtn.addEventListener("click", () => {
        speechOn = !speechOn;
        soundBtn.textContent = speechOn ? "🔊" : "🔇";
        if (speechOn) speak(sayEl.textContent);
        else if ("speechSynthesis" in window) speechSynthesis.cancel();
      });

      // ---------- UI ----------
      const $ = (s) => document.querySelector(s);
      const sayEl = $("#say"), actionBtn = $("#action"), card = $("#card");
      const hintEl = $("#hint"), tagCom = $("#tagCom"), flashEl = $("#flash"), vignette = $("#vignette");
      const hudSlots = [...document.querySelectorAll("#hud div")];
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const until = (f) => new Promise((r) => { const id = setInterval(() => f() && (clearInterval(id), r()), 50); });

      function say(html, plain = html.replace(/<[^>]+>/g, "")) {
        gsap.killTweensOf(sayEl);
        gsap.to(sayEl, {
          opacity: 0, y: -8, duration: 0.15,
          onComplete: () => {
            sayEl.innerHTML = html;
            gsap.fromTo(sayEl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" });
          },
        });
        speak(plain);
      }
      function setKicker(text) { $("#kicker").innerHTML = `Kuzushi · <b>${text}</b>`; }

      function showAction(label, onClick) {
        actionBtn.textContent = label;
        actionBtn.onclick = () => { hideAction(); onClick(); };
        actionBtn.style.pointerEvents = "auto";
        gsap.fromTo(actionBtn, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", delay: 0.2 });
      }
      function hideAction() {
        actionBtn.style.pointerEvents = "none";
        actionBtn.onclick = null;
        gsap.to(actionBtn, { opacity: 0, duration: 0.2 });
      }

      function showCard({ k = "", title = "", text = "", button, onClick }) {
        card.querySelector(".k").textContent = k;
        const h1 = card.querySelector("h1");
        h1.textContent = title;
        h1.classList.toggle("long", title.length > 16);
        card.querySelector("p").textContent = text;
        const btn = card.querySelector("button");
        btn.textContent = button;
        btn.onclick = () => {
          ensureAudio();
          card.style.pointerEvents = "none";
          gsap.to(card, { opacity: 0, duration: 0.3, onComplete: onClick });
        };
        card.style.pointerEvents = "auto";
        gsap.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.35 });
        gsap.fromTo(h1, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power4.out" });
        speak([title, text].filter(Boolean).join(". "));
      }

      function flash(word) {
        flashEl.textContent = word;
        gsap.killTweensOf(flashEl);
        gsap.timeline()
          .fromTo(flashEl, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" })
          .to(flashEl, { opacity: 0, scale: 0.96, duration: 0.5, delay: 0.7 });
        gsap.fromTo(vignette, { opacity: 1 }, { opacity: 0, duration: 1.4 });
      }

      // Wisch-Hinweis an den Füßen
      let hintTween = null;
      function showHint(text, dx = 60) {
        hintEl.textContent = text;
        hintTween?.kill();
        gsap.to(hintEl, { opacity: 1, duration: 0.3 });
        hintTween = gsap.fromTo(hintEl, { x: -dx / 2 }, { x: dx / 2, duration: 0.8, repeat: -1, yoyo: true, ease: "sine.inOut" });
      }
      function hideHint() { hintTween?.kill(); gsap.to(hintEl, { opacity: 0, duration: 0.2 }); }

      // ---------- Eingabe: waagerecht wischen ----------
      let allowInput = false;
      let down = null;
      const attempt = { actions: [], lastT: 0, open: false };
      function newAttempt() { attempt.actions = []; attempt.lastT = 0; }

      function userAct(dir, s) {
        if (!allowInput || phys.fallen || phys.frozen) return;
        ensureAudio();
        hideHint();
        attempt.open = true;
        act(dir, s);
        hooks.onAct?.(dir, s);
      }

      canvas.addEventListener("pointerdown", (e) => (down = { x: e.clientX, y: e.clientY }));
      canvas.addEventListener("pointerup", (e) => {
        if (!down) return;
        const dx = e.clientX - down.x;
        down = null;
        if (Math.abs(dx) < 24) {
          if (allowInput) gsap.fromTo(sayEl, { x: -8 }, { x: 0, duration: 0.4, ease: "elastic.out(1, 0.3)" });
          return;
        }
        const s = THREE.MathUtils.clamp(0.3 + Math.abs(dx) / (Math.min(innerWidth, 1000) * 0.3), 0.35, MAX_S);
        userAct(Math.sign(dx), s);
      });
      // Tastatur: → drücken, ← ziehen (mit Shift sanft)
      addEventListener("keydown", (e) => {
        const s = e.shiftKey ? 0.6 : 1.0;
        if (e.key === "ArrowRight" || e.key === "d") userAct(1, s);
        if (e.key === "ArrowLeft" || e.key === "a") userAct(-1, s);
      });

      // ---------- Versuch auswerten ----------
      const hooks = {};
      function gradeOf(a) {
        // Timing: wie weit lehnte er schon in deine Zugrichtung?
        const q = Math.max(0, (a.c * a.dir) / LEAN);
        const label = q > 0.85 ? "Perfekt" : q > 0.55 ? "Gut" : "Knapp";
        return { q, label, pct: Math.round((a.s / MAX_S) * 100) };
      }
      // Kein Wurf: 2,8 s Spielzeit nach der letzten Aktion steht er noch
      function checkAttempt() {
        if (!attempt.open || phys.lost || phys.fallen) return;
        if (phys.t - attempt.lastT > 2.8) {
          attempt.open = false;
          hooks.onFail?.([...attempt.actions]);
          newAttempt();
        }
      }

      // Treffer-Ablauf: Hit-Stop in Zeitlupe, Schriftzug, Aufprall
      hooks.onLost = () => {
        sfx.lost();
        flash("Kuzushi");
        if (!replayQueue) {
          gsap.timeline()
            .to(phys, { timeScale: 0.12, duration: 0.08 })
            .to(phys, { timeScale: 1, duration: 0.8, delay: 0.45, ease: "power2.in" });
        }
      };

      // ---------- Die Journey ----------
      const flow = {
        start() {
          setKicker("Teens");
          showCard({ k: "Grappling · Teens", title: "Kuzushi", text: "Bring ihn aus dem Gleichgewicht.", button: "Start", onClick: flow.r1 });
        },

        // Runde 1: Einfach drücken – er fällt nicht
        r1() {
          setKicker("Runde 1");
          say("Wisch nach rechts und drück ihn um.");
          showHint("wisch →", 80);
          allowInput = true;
          let fails = 0;
          hooks.onAct = null;
          hooks.onFail = (actions) => {
            fails++;
            if (fails === 1) say("Fester!");
            else {
              allowInput = false;
              flow.lastFail = actions;
              showCard({ k: "Frage", title: "Er fällt nicht.", text: "Was macht er, wenn du drückst?", button: "Zeig's mir", onClick: flow.explain1 });
            }
          };
          hooks.onLand = () => flow.success(flow.r2);
        },

        // Zeitlupe: er lehnt sich gegen dich
        async explain1() {
          setKicker("Zeitlupe");
          say("Schau auf seine Kugel.");
          gsap.to(tagCom, { opacity: 1, duration: 0.3 });
          hooks.onFail = null;
          hooks.onLand = null;
          const push = flow.lastFail?.find((a) => a.dir > 0) || { dir: 1, s: 1.2, t: 0 };
          await replay([{ ...push, t: 0 }], 0.4);
          say("Er drückt zurück – seine Kugel wandert <em>zu dir</em>.");
          await wait(600);
          showAction("Weiter", () => { gsap.to(tagCom, { opacity: 0, duration: 0.3 }); flow.r2(); });
        },

        // Runde 2: Drücken, dann mit seiner Reaktion ziehen
        async r2() {
          await standUp(0.4);
          newAttempt();
          setKicker("Runde 2");
          say("Drück – und wenn die Linie <em>gelb</em> wird: zieh.");
          showHint("→  dann  ←", 0);
          allowInput = true;
          let fails = 0;
          hooks.onAct = null;
          hooks.onFail = () => {
            fails++;
            say(fails % 2 ? "Achte auf die <em>gelbe</em> Linie – dann zieh nach links." : "Erst drücken. Warten. Dann ziehen.");
          };
          hooks.onLand = () => flow.success(flow.whyCard);
        },

        // Gemeinsamer Treffer-Abschluss
        async success(next) {
          allowInput = false;
          attempt.open = false;
          const g = gradeOf(lastAction);
          flow.lastThrow = [...attempt.actions];
          flow.lastGrade = g;
          await wait(500);
          sfx.ding();
          say(`${g.label}! Nur ${g.pct} % Kraft.`);
          await wait(1600);
          next();
        },

        whyCard() {
          showCard({ k: "Frage", title: "Warum so leicht?", button: "Zeig's mir", onClick: flow.explain2 });
        },

        async explain2() {
          setKicker("Zeitlupe");
          say("Schau auf seine Kugel.");
          gsap.to(tagCom, { opacity: 1, duration: 0.3 });
          hooks.onLand = null;
          await replay(flow.lastThrow.slice(-4), 0.35);
          say("Seine Kugel stand schon an der Kante – ein kleiner Zug reicht.");
          await wait(800);
          showAction("Weiter", () => { gsap.to(tagCom, { opacity: 0, duration: 0.3 }); flow.r3(); });
        },

        // Runde 3: Drei Würfe mit möglichst wenig Kraft
        async r3() {
          await standUp(0.5);
          newAttempt();
          setKicker("Challenge");
          say("Drei Würfe. So <em>wenig Kraft</em> wie möglich.");
          hudSlots.forEach((d) => { d.classList.remove("done"); d.querySelector("b").textContent = "–"; });
          gsap.to("#hud", { opacity: 1, duration: 0.4 });
          allowInput = true;
          let n = 0;
          hooks.onAct = null;
          hooks.onFail = () => say("Noch nicht. Drück – warte auf <em>gelb</em> – zieh.");
          hooks.onLand = async () => {
            allowInput = false;
            attempt.open = false;
            const g = gradeOf(lastAction);
            const slot = hudSlots[n];
            slot.classList.add("done");
            slot.querySelector("b").textContent = `${g.label} ${g.pct}%`;
            gsap.fromTo(slot, { scale: 1.2 }, { scale: 1, duration: 0.5, ease: "back.out(3)" });
            sfx.ding();
            n++;
            await wait(1300);
            if (n < 3) {
              say(n === 1 ? "Noch zwei." : "Letzter Wurf.");
              await standUp();
              newAttempt();
              allowInput = true;
            } else {
              await wait(400);
              gsap.to("#hud", { opacity: 0, duration: 0.4 });
              flow.end();
            }
          };
        },

        end() {
          setKicker("Merksatz");
          showCard({
            k: "Merksatz",
            title: "Gegen seine Kraft: schwer.\nMit seiner Kraft: leicht.",
            text: "Auf der Matte: drücken, Reaktion spüren, ziehen – 10× pro Seite mit deinem Partner.",
            button: "Freies Training",
            onClick: flow.free,
          });
        },

        async free() {
          await standUp(0.5);
          newAttempt();
          setKicker("Freies Training");
          say("Probier auch: erst ziehen, dann drücken.");
          allowInput = true;
          hooks.onFail = null;
          hooks.onLand = async () => {
            allowInput = false;
            attempt.open = false;
            const g = gradeOf(lastAction);
            say(`${g.label}! ${g.pct} % Kraft.`);
            await wait(1400);
            await standUp();
            newAttempt();
            allowInput = true;
          };
        },
      };

      // ---------- Animationsschleife ----------
      const clock = new THREE.Clock();
      function tick() {
        const dt = Math.min(clock.getDelta(), 1 / 30);
        const time = clock.elapsedTime;

        stepPhysics(dt * phys.timeScale);
        checkAttempt();
        updateFigure();
        updateIndicator(time);
        updateGrip();

        // Kamera: folgt sanft, wackelt beim Aufprall
        const targetX = phys.fallen || phys.lost ? comWorld.x * 0.4 : 0;
        camLook.x += (targetX - camLook.x) * (1 - Math.exp(-dt * 2));
        shake.amp *= Math.exp(-dt * 6);
        camera.position.set(camLook.x + 1.2 + (Math.random() - 0.5) * shake.amp, 0.36 * camDist + (Math.random() - 0.5) * shake.amp, camDist);
        camera.lookAt(camLook);

        // DOM-Helfer an 3D-Punkte heften
        const c = toScreen(comWorld);
        tagCom.style.left = c.x + 90 + "px";
        tagCom.style.top = c.y - 24 + "px";
        const f = toScreen(new THREE.Vector3(0, 0, 0.9));
        hintEl.style.left = f.x + "px";
        hintEl.style.top = f.y + 40 + "px";

        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
      flow.start();

      // Zum Testen in der Konsole
      window.kuzushi = { phys, ai, act, flow, attempt };
    </script>
  </body>
</html>

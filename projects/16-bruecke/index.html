    <style>
      /* ---------- Farben & Grundlagen (wie „Der Fels“ und „Fallschule“) ---------- */
      :root {
        --bg: #fff3e3;
        --ink: #2b1b17;
        --red: #cf1830;
        --white: #ffffff;
        --ok: #1db954;
        --out: #e5243b;
        --gold: #ffd23f;
        --soft: #e7d3bd;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--ink);
        font-family: "Fredoka", system-ui, sans-serif;
        user-select: none; -webkit-user-select: none;
        touch-action: none; overscroll-behavior: none;
      }
      canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      button { font-family: inherit; cursor: pointer; border: 0; }

      /* ---------- Modus-Umschalter ---------- */
      .modes {
        position: fixed; left: 50%; top: calc(12px + var(--safe-top)); transform: translateX(-50%); z-index: 6;
        display: flex; padding: 5px; border-radius: 999px; background: var(--white); box-shadow: 0 3px 0 var(--soft);
      }
      .modes a { padding: 8px 14px; border-radius: 999px; font-size: 17px; font-weight: 600; color: #8a6a55; text-decoration: none; white-space: nowrap; }
      .modes a[aria-current="page"] { background: var(--red); color: var(--white); }

      /* ---------- Satz oben ---------- */
      #say {
        position: fixed; left: 16px; right: 16px; top: calc(76px + var(--safe-top));
        text-align: center; font-weight: 700; line-height: 1.1;
        font-size: clamp(28px, 6vw, 52px); pointer-events: none; text-wrap: balance;
      }
      #stars {
        position: fixed; left: 50%; top: calc(76px + var(--safe-top) + clamp(40px, 8vw, 70px));
        transform: translateX(-50%); display: flex; gap: 10px;
        font-size: clamp(30px, 6vw, 44px); pointer-events: none; opacity: 0;
      }
      #stars span { color: var(--soft); display: inline-block; }
      #stars span.on { color: var(--gold); text-shadow: 0 2px 0 #c99a00; }

      /* ---------- Knöpfe ---------- */
      .btn {
        background: var(--red); color: var(--white); font-weight: 700;
        font-size: clamp(24px, 4.5vw, 34px); padding: 18px 44px; border-radius: 999px;
        box-shadow: 0 6px 0 #8f0f20, 0 14px 30px rgba(207, 24, 48, 0.3); transition: transform 0.12s;
      }
      .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8f0f20; }
      #action { position: fixed; left: 50%; bottom: calc(28px + var(--safe-bottom)); transform: translateX(-50%); opacity: 0; pointer-events: none; z-index: 3; }
      .round {
        position: fixed; top: calc(14px + var(--safe-top)); height: 52px; border-radius: 999px; background: var(--white);
        box-shadow: 0 3px 0 var(--soft); z-index: 5; font-size: 18px; font-weight: 700; color: var(--ink);
      }
      #sound { right: calc(14px + env(safe-area-inset-right, 0px)); width: 52px; font-size: 24px; }
      #levelBtn { left: calc(14px + env(safe-area-inset-left, 0px)); padding: 0 18px; }

      /* ---------- Karte ---------- */
      #card {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 4;
        background: rgba(255, 243, 227, 0.78); backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none;
      }
      #card .inner { text-align: center; padding: 16px; max-width: 980px; }
      #card h1 { margin: 0 0 10px; font-weight: 700; line-height: 1; white-space: pre-line; font-size: clamp(44px, 10vw, 96px); color: var(--red); text-wrap: balance; }
      #card h1.long { font-size: clamp(34px, 6.4vw, 68px); }
      #card p { margin: 0 0 30px; font-weight: 600; line-height: 1.15; font-size: clamp(24px, 4.6vw, 40px); text-wrap: balance; }
      #card .seal { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 50%; border: 6px solid var(--red); display: grid; place-items: center; font-size: 48px; background: var(--white); }
      #card .seal[hidden], #card .btn[hidden], #card .levels[hidden], #card .topics[hidden] { display: none; }
      #card .btn.alt { background: var(--white); color: var(--red); box-shadow: 0 6px 0 var(--soft); margin-left: 12px; }
      #card .levels { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
      #card .levels button { width: min(172px, 40vw); padding: 20px 10px; border-radius: 28px; background: var(--white); box-shadow: 0 6px 0 var(--soft); color: var(--ink); }
      #card .levels button b { display: block; font-size: clamp(22px, 4vw, 30px); color: var(--red); }
      #card .levels button span { font-size: clamp(16px, 2.6vw, 20px); font-weight: 600; }
      #card .topics { display: flex; gap: 10px; justify-content: center; margin: -6px 0 22px; flex-wrap: wrap; }
      #card .topics a, #card .topics span { padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 19px; text-decoration: none; background: var(--white); color: #8a6a55; box-shadow: 0 3px 0 var(--soft); }
      #card .topics span { background: var(--red); color: var(--white); box-shadow: none; }

      /* ---------- Brücken-Knöpfe (unten) ---------- */
      #bridges { position: fixed; left: 50%; bottom: calc(22px + var(--safe-bottom)); transform: translateX(-50%); display: flex; gap: 12px; z-index: 3; }
      .bridge, .feet {
        width: clamp(84px, 17vw, 124px); padding: 12px 6px 10px; border-radius: 24px; background: var(--white);
        box-shadow: 0 6px 0 var(--soft); color: var(--ink); text-align: center; display: none;
      }
      .bridge.show, .feet.show { display: block; }
      .bridge i, .feet i { display: block; font-style: normal; font-size: clamp(30px, 6vw, 42px); line-height: 1.1; color: var(--red); font-weight: 700; }
      .bridge b, .feet b { display: block; font-size: clamp(15px, 2.8vw, 20px); }
      .feet.on { background: var(--ok); color: var(--white); box-shadow: 0 6px 0 #138a3e; }
      .feet.on i { color: var(--white); }
      .bridge:active, .feet:active { transform: translateY(4px); }
      .pulse { animation: pulse 0.9s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(1.12); } }

      /* ---------- „Fest!“-Punkte auf Bos Arm und Fuß ---------- */
      .grab {
        position: fixed; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%;
        background: var(--white); border: 4px dashed var(--red); color: var(--red);
        font-weight: 700; font-size: 15px; line-height: 1; display: none; place-items: center; z-index: 2;
      }
      .grab.show { display: grid; }
      .grab.on { background: var(--red); color: var(--white); border-style: solid; }
      .grab.pulse { animation: pulse 0.9s ease-in-out infinite; }

      .tag { position: fixed; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 22px; background: var(--white); pointer-events: none; opacity: 0; transform: translate(-50%, -50%); box-shadow: 0 3px 0 rgba(0,0,0,0.08); white-space: nowrap; z-index: 2; }
      .tag.bad { background: var(--out); color: var(--white); }
      .tag.good { background: var(--ok); color: var(--white); }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <nav class="modes" aria-label="Altersstufe">
      <a href="../12-fels/" aria-current="page">Kinder</a>

    <div id="say" aria-live="polite"></div>
    <div id="stars" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
    <button id="sound" class="round" aria-label="Ton an oder aus">🔊</button>

    <div id="bridges">
      <button class="feet" aria-label="Füße an den Po"><i>🦶</i><b>Füße ran</b></button>
      <button class="bridge" data-dir="-1" aria-label="Brücke nach links"><i>↖</i><b>Brücke</b></button>
      <button class="bridge" data-dir="0" aria-label="Brücke nach oben"><i>↑</i><b>Brücke</b></button>

    </div>

    <!-- Fest-Punkte: Bos Arm und Fuß links/rechts (aus Sicht des Bildschirms) -->
    <button class="grab" data-part="arm" data-side="-1">Arm<br />fest</button>
    <button class="grab" data-part="arm" data-side="1">Arm<br />fest</button>
    <button class="grab" data-part="foot" data-side="-1">Fuß<br />fest</button>
    <button class="grab" data-part="foot" data-side="1">Fuß<br />fest</button>

    <div id="tagPost" class="tag bad">abgestützt!</div>
    <div id="tagStep" class="tag bad">Fuß raus!</div>
    <div id="tagTop" class="tag good">Du bist oben!</div>

    <div id="card"><div class="inner">
      <div class="seal" hidden>🌉</div>
      <h1></h1>
      <div class="topics" hidden><a href="../12-fels/">🪨 Stehen</a><a href="../15-fallschule/">🤸 Fallen</a><span>🌉 Unten raus</span><a href="../17-hueftflucht/">🦐 Hüfte raus</a></div>
      <p></p>
      <div class="levels" hidden>
        <button data-level="1"><b>Level 1</b><span>Zur Seite</span></button>
        <button data-level="2"><b>Level 2</b><span>Füße an den Po</span></button>
        <button data-level="3"><b>Level 3</b><span>Arm fest</span></button>
        <button data-level="4"><b>Level 4</b><span>Bein fest</span></button>
        <button data-level="5"><b>Level 5</b><span>Alles zusammen</span></button>
      </div>
      <button class="btn main"></button><button class="btn alt" hidden></button>
    </div></div>

    <script type="module">
      import * as THREE from "three";

      /* =====================================================================
         DIE BRÜCKE · Kinder (Thema 3 nach „Der Fels“ und „Fallschule“)
         Bo sitzt auf dir (Mount). So kommst du raus: Arm fest, Bein fest, Brücke zur Seite.

         Physik – derselbe Kippblock wie bei „Der Fels“, nur liegt das Kind unten:
         - Bo kniet: seine Fläche reicht links/rechts bis zu den Knien (b = 0.55).
         - Deine Brücke gibt ihm einen Drehimpuls zur Seite:
             ω₀ = K · s · d · h / (b² + h²)
           s = Kraft der Brücke (Füße am Po = 1, weit weg = 0.55)
           d = Richtung (über die Schulter = 1, gerade hoch = 0.15)
         - Kippt er, fängt er sich nach 0.12 s mit Reflexen: Hand abstützen (b → 1.15)
           oder Fuß rausstellen (b → 1.1). Hältst du Arm/Fuß auf DER Seite fest,
           geht das nicht – seine Fläche bleibt schmal und er rollt runter.
         Das ist die „schwache Seite“ aus „Der Fels“, nur am Boden.
         ===================================================================== */

      // ---------- Einstellungen ----------
      const G = 9.81;
      const K = 2.6;
      const B_KNEE = 0.55, B_POST = 1.15, B_STEP = 1.1;
      const REFLEX = 0.12;                 // Bos Reaktionszeit (s)
      const S_CLOSE = 1, S_FAR = 0.55;     // Brücken-Kraft: Füße am Po / weit weg
      const D_SIDE = 1, D_UP = 0.15;       // Richtung: über die Schulter / gerade hoch
      const COLORS = {
        bg: 0xfff3e3, mat: 0xf9b233, matBorder: 0xcf1830, gi: 0xffffff,
        kid: 0x14b8a6, kidBelt: 0xff6b00, bo: 0xff8a3d, boBelt: 0x2bb673, gold: 0xffd23f, red: 0xcf1830,
      };

      // ---------- Renderer, Szene, Kamera ----------
      const canvas = document.getElementById("scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(COLORS.bg);
      scene.fog = new THREE.Fog(COLORS.bg, 16, 32);
      const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
      const camLook = new THREE.Vector3(0, 0.75, -0.1);
      const shake = { amp: 0 };

      scene.add(new THREE.HemisphereLight(0xfff8ee, 0xf2a65a, 1.6));
      const sun = new THREE.DirectionalLight(0xffffff, 2.2);
      sun.position.set(-4, 9, 5);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 25 });
      sun.shadow.radius = 6;
      scene.add(sun);

      const mat = new THREE.Mesh(new THREE.BoxGeometry(14, 0.3, 12), new THREE.MeshStandardMaterial({ color: COLORS.matBorder, roughness: 0.9 }));
      mat.position.y = -0.15;
      mat.receiveShadow = true;
      scene.add(mat);
      const matInner = new THREE.Mesh(new THREE.PlaneGeometry(12, 10), new THREE.MeshStandardMaterial({ color: COLORS.mat, roughness: 0.95 }));
      matInner.rotation.x = -Math.PI / 2;
      matInner.position.y = 0.001;
      matInner.receiveShadow = true;
      scene.add(matInner);

      // ---------- Bausteine ----------
      const toon = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, flatShading: true });
      const mGi = toon(COLORS.gi), mKid = toon(COLORS.kid), mKidBelt = toon(COLORS.kidBelt), mBo = toon(COLORS.bo), mBoBelt = toon(COLORS.boBelt);
      const mDark = new THREE.MeshBasicMaterial({ color: 0x1a1a1a }), mCheek = new THREE.MeshBasicMaterial({ color: 0xff8fa3 });
      const ico = (r, d = 1) => new THREE.IcosahedronGeometry(r, d);
      const shadowy = (m) => ((m.castShadow = true), m);
      const limbGeo = new THREE.CylinderGeometry(1, 1, 1, 8);
      const UP = new THREE.Vector3(0, 1, 0), tmpV = new THREE.Vector3();
      function limb(mat, r) { const m = shadowy(new THREE.Mesh(limbGeo, mat)); m.userData.r = r; return m; }
      function placeLimb(mesh, a, b) {
        mesh.position.copy(a).add(b).multiplyScalar(0.5);
        tmpV.copy(b).sub(a);
        mesh.scale.set(mesh.userData.r, tmpV.length(), mesh.userData.r);
        mesh.quaternion.setFromUnitVectors(UP, tmpV.normalize());
      }
      function face(headGroup, headMat, r) {
        headGroup.add(shadowy(new THREE.Mesh(ico(r, 2), headMat)));
        for (const s of [-1, 1]) {
          const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), mDark);
          eye.position.set(s * 0.13, 0.05, r * 0.92);
          headGroup.add(eye);
          const cheek = new THREE.Mesh(new THREE.CircleGeometry(0.055, 12), mCheek);
          cheek.position.set(s * 0.23, -0.07, r * 0.82);
          cheek.rotation.y = s * 0.55;
          headGroup.add(cheek);
        }
        const smile = new THREE.Mesh(new THREE.TorusGeometry(0.065, 0.016, 6, 12, Math.PI), mDark);
        smile.position.set(0, -0.07, r * 0.95);
        smile.rotation.z = Math.PI;
        headGroup.add(smile);
      }

      /* ---------- Du: liegst auf dem Rücken, Kopf zur Kamera (+z), Knie hoch ----------
         kid.hip = Hüfthöhe (Brücke hebt sie), kid.roll = Drehung zur Brücken-Seite */
      const kid = { hip: 0, roll: 0, feet: 1, sitUp: 0 }; // feet: 1 = am Po, 0 = weit weg
      const kidRoot = new THREE.Group();
      scene.add(kidRoot);
      const kidBody = new THREE.Group(); // dreht sich bei der Brücke um die Längsachse
      kidRoot.add(kidBody);
      const kidTorso = shadowy(new THREE.Mesh(ico(1, 2), mGi));
      kidTorso.scale.set(0.55, 0.3, 0.62);
      kidBody.add(kidTorso);
      const kidBeltM = shadowy(new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.06, 6, 18), mKidBelt));
      kidBeltM.scale.set(1.05, 1, 0.6);
      kidBody.add(kidBeltM);
      const kidHead = new THREE.Group();
      face(kidHead, mKid, 0.38);
      kidHead.rotation.x = -Math.PI / 2 + 0.25; // schaut nach oben
      kidBody.add(kidHead);
      const kidArms = [-1, 1].map((s) => ({ s, upper: limb(mGi, 0.1), hand: shadowy(new THREE.Mesh(ico(0.11, 1), mKid)) }));
      const kidLegs = [-1, 1].map((s) => ({ s, thigh: limb(mGi, 0.13), shin: limb(mGi, 0.11), knee: shadowy(new THREE.Mesh(ico(0.13, 1), mGi)), foot: shadowy(new THREE.Mesh(ico(1, 1), mKid)) }));
      kidArms.forEach((a) => kidRoot.add(a.upper, a.hand));
      kidLegs.forEach((L) => { L.foot.scale.set(0.13, 0.09, 0.24); kidRoot.add(L.thigh, L.shin, L.knee, L.foot); });

      /* ---------- Bo: kniet auf dir, schaut zur Kamera ----------
         boRoot wird über eine Matrix um seine Kippkante gedreht (wie bei „Der Fels“). */
      const boRoot = new THREE.Group();
      boRoot.matrixAutoUpdate = false;
      scene.add(boRoot);
      const boUpper = new THREE.Group();
      boRoot.add(boUpper);
      const boTorso = shadowy(new THREE.Mesh(ico(1, 2), mGi));
      boTorso.scale.set(0.58, 0.6, 0.46);
      boTorso.position.y = 0.42;
      boUpper.add(boTorso);
      const boBeltM = shadowy(new THREE.Mesh(new THREE.TorusGeometry(0.53, 0.07, 6, 18), mBoBelt));
      boBeltM.rotation.x = Math.PI / 2;
      boBeltM.scale.set(1, 0.82, 1);
      boBeltM.position.y = 0.18;
      boUpper.add(boBeltM);
      const boHead = new THREE.Group();
      boHead.position.y = 1.15;
      face(boHead, mBo, 0.4);
      boUpper.add(boHead);
      const boArms = [-1, 1].map((s) => ({ s, upper: limb(mGi, 0.11), lower: limb(mGi, 0.1), hand: shadowy(new THREE.Mesh(ico(0.12, 1), mBo)), post: 0 }));
      const boLegs = [-1, 1].map((s) => ({ s, thigh: limb(mGi, 0.15), shin: limb(mGi, 0.13), knee: shadowy(new THREE.Mesh(ico(0.15, 1), mGi)), foot: shadowy(new THREE.Mesh(ico(1, 1), mBo)), step: 0 }));
      boArms.forEach((a) => boRoot.add(a.upper, a.lower, a.hand));
      boLegs.forEach((L) => { L.foot.scale.set(0.13, 0.09, 0.22); boRoot.add(L.thigh, L.shin, L.knee, L.foot); });
      // „Fest“-Griffe: deine Hand auf seinem Arm / dein Fuß an seinem Fuß
      const grabMarks = {};
      for (const k of ["arm-1", "arm1", "foot-1", "foot1"]) {
        const m = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.045, 8, 20), new THREE.MeshStandardMaterial({ color: COLORS.red, emissive: COLORS.red, emissiveIntensity: 0.5 }));
        m.visible = false;
        scene.add(m);
        grabMarks[k] = m;
      }

      // ---------- Bos Haltung: Knie an deiner Hüfte, Oberkörper aufrecht ----------
      const bo = { hipY: 0.95, lean: 0, bounce: 0 }; // hipY: Höhe seiner Hüfte (Level 1: höher); bounce: nur sichtbares Hüpfen
      const boLocal = { // in Bos eigenem Rahmen (vor dem Kippen); x = links/rechts, z = zur Kamera
        knee: (s, step) => new THREE.Vector3(s * (B_KNEE + step * (B_STEP - B_KNEE)), 0.13, 0.05),
        foot: (s, step) => new THREE.Vector3(s * (0.45 + step * 0.45), 0.08, -0.75 + step * 0.45),
        shoulder: (s) => new THREE.Vector3(s * 0.5, bo.hipY + 0.72, 0.05),
        handRest: (s) => new THREE.Vector3(s * 0.28, bo.hipY + 0.05, 0.45),  // Hände auf deiner Brust
        handPost: (s) => new THREE.Vector3(s * B_POST, 0.1, 0.55),            // Hand auf der Matte
      };
      const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
      function applyBo() {
        boUpper.position.y = bo.hipY + bo.bounce;
        boUpper.rotation.x = bo.lean;
        for (const L of boLegs) {
          const hip = vA.set(L.s * 0.22, bo.hipY, 0);
          const knee = boLocal.knee(L.s, L.step), foot = boLocal.foot(L.s, L.step);
          placeLimb(L.thigh, hip, knee);
          placeLimb(L.shin, knee, foot);
          L.knee.position.copy(knee);
          L.foot.position.copy(foot);
        }
        for (const a of boArms) {
          const sh = boLocal.shoulder(a.s);
          const hand = vB.copy(boLocal.handRest(a.s)).lerp(boLocal.handPost(a.s), a.post);
          const elbow = vC.copy(sh).lerp(hand, 0.5).add(new THREE.Vector3(a.s * 0.18, 0.05, -0.05));
          placeLimb(a.upper, sh, elbow);
          placeLimb(a.lower, elbow, hand);
          a.hand.position.copy(hand);
        }
      }

      // Du: Hüfte heben (Brücke), zur Seite drehen, Füße ran/weg, am Ende aufsitzen
      function applyKid() {
        const hip = 0.32 + kid.hip;
        kidBody.position.set(0, hip, 0.35);
        // Brücke: Hüfte hoch, Kopf/Schultern bleiben unten; am Ende aufsitzen
        kidBody.rotation.set(-0.08 + kid.hip * 0.6 - kid.sitUp * 0.9, 0, -kid.roll * 0.5);
        kidHead.position.set(0, 0.05, 0.95);
        kidBeltM.position.set(0, 0, -0.35);
        kidBeltM.rotation.set(Math.PI / 2, 0, 0);
        // Arme: liegen neben dir oder greifen Bos Arm
        for (const a of kidArms) {
          const sh = vA.set(a.s * 0.5, hip + 0.05, 0.85);
          const trapped = grabs[`arm${a.s}`];
          const target = trapped ? boArmWorld(a.s) : vB.set(a.s * 0.9, 0.1, 0.55);
          placeLimb(a.upper, sh, target);
          a.hand.position.copy(target);
        }
        // Beine: Knie hoch, Füße am Po (feet = 1) oder weit weg
        const footZ = THREE.MathUtils.lerp(-1.55, -0.95, kid.feet);
        for (const L of kidLegs) {
          const hipJ = vA.set(L.s * 0.25, hip - 0.05, -0.2);
          const trapped = grabs[`foot${L.s}`];
          const foot = trapped ? boFootWorld(L.s).add(new THREE.Vector3(L.s * 0.25, 0, 0)) : vB.set(L.s * 0.45, 0.1, footZ);
          const mid = vC.copy(hipJ).add(foot).multiplyScalar(0.5);
          const d = hipJ.distanceTo(foot);
          const knee = mid.clone().add(new THREE.Vector3(L.s * 0.1, 1, 0).normalize().multiplyScalar(Math.sqrt(Math.max(0.02, 0.78 * 0.78 - (d / 2) ** 2))));
          placeLimb(L.thigh, hipJ, knee);
          placeLimb(L.shin, knee, foot);
          L.knee.position.copy(knee);
          L.foot.position.copy(foot);
        }
      }
      // Welt-Positionen von Bos Arm/Fuß (für die Griffe)
      const boArmWorld = (s) => boArms[s > 0 ? 1 : 0].lower.getWorldPosition(new THREE.Vector3());
      const boFootWorld = (s) => boLegs[s > 0 ? 1 : 0].foot.getWorldPosition(new THREE.Vector3());

      // ---------- Physik: Bo kippt zur Seite ----------
      const tip = { phi: 0, w: 0, side: 0, t: 0, tStart: null, rolled: false, frozen: false, timeScale: 1, b: B_KNEE };
      // was Bo darf (je Level) und was du festhältst
      const reflex = { post: false, step: false };
      const grabs = { "arm-1": false, arm1: false, "foot-1": false, foot1: false };
      let preposted = 0; // Level 5: Bo hat sich schon auf einer Seite abgestützt

      // Bos Schwerpunkt über der Matte (Level 1: sitzt hoch → 1.25, sonst tief → 1.05; wie in der Rechnung)
      const comH = () => bo.hipY + 0.1;

      // Wie breit ist Bos Fläche zur Seite s? Die Physik zählt den Reflex sofort,
      // die Animation von Hand/Fuß läuft nur hinterher.
      const based = { "post-1": false, post1: false, "step-1": false, step1: false };
      function baseTo(s) {
        return Math.max(B_KNEE, based[`post${s}`] ? B_POST : 0, based[`step${s}`] ? B_STEP : 0);
      }

      function bridge(dir) {
        if (tip.frozen || tip.rolled || tip.phi !== 0) return;
        const s = dir === 0 ? (Math.random() < 0.5 ? -1 : 1) : dir;
        const d = dir === 0 ? D_UP : D_SIDE;
        const force = kid.feet > 0.5 ? S_CLOSE : S_FAR;
        const h = comH(), b = baseTo(s);
        tip.side = s;
        tip.w = (K * force * d * h) / (b * b + h * h);
        tip.tStart = null;
        tip.result = null;
        // Brücke sichtbar: Hüfte hoch, zur Seite drehen
        gsap.timeline()
          .to(kid, { hip: 0.18 + 0.22 * force, roll: dir, duration: 0.18, ease: "power2.out" })
          .to(kid, { hip: 0, roll: 0, duration: 0.5, ease: "power2.inOut" });
        gsap.fromTo(bo, { bounce: 0.12 * force }, { bounce: 0, duration: 0.5, ease: "bounce.out" });
        sfx.bridge(force);
        pendingBridge = { dir, force };
      }

      function stepTip(dt) {
        if (tip.frozen || tip.rolled || (tip.phi === 0 && tip.w === 0)) return;
        const n = Math.ceil(dt / (1 / 300));
        for (let i = 0; i < n; i++) {
          const h = comH();
          tip.t += dt / n;
          if (tip.tStart === null && tip.phi > 0.06) tip.tStart = tip.t;
          // Reflexe: nach REFLEX Sekunden fängt er sich – wenn er darf
          if (tip.tStart !== null && tip.t - tip.tStart >= REFLEX) {
            const sIdx = tip.side > 0 ? 1 : 0;
            if (reflex.post && !grabs[`arm${tip.side}`] && !based[`post${tip.side}`]) { based[`post${tip.side}`] = true; gsap.to(boArms[sIdx], { post: 1, duration: 0.12 }); flashTag(tagPost, boArms[sIdx].hand); sfx.post(); }
            if (reflex.step && !grabs[`foot${tip.side}`] && !based[`step${tip.side}`]) { based[`step${tip.side}`] = true; gsap.to(boLegs[sIdx], { step: 1, duration: 0.12 }); flashTag(tagStep, boLegs[sIdx].foot); }
            tip.tStart = Infinity;
          }
          // Fläche zur Kipp-Seite: wird breiter, sobald Hand/Fuß unten sind
          const target = tip.phi > 0.02 ? baseTo(tip.side) : B_KNEE;
          tip.b = target;
          const b = tip.b, R = Math.hypot(b, h), alpha = Math.atan2(b, h), p2 = (3 * G) / (4 * R);
          tip.w += -p2 * Math.sin(alpha - tip.phi) * (dt / n);
          tip.w *= 1 - 0.8 * (dt / n);
          tip.phi += tip.w * (dt / n);
          if (tip.phi <= 0) { tip.phi = 0; tip.w = 0; squash(); resolveBridge(false); return; }
          if (tip.phi >= 1.25) { tip.phi = 1.25; tip.w = 0; tip.rolled = true; resolveBridge(true); return; }
        }
      }

      // ---------- Bo-Matrix: um die Kante seiner Fläche kippen ----------
      const mA = new THREE.Matrix4(), mB = new THREE.Matrix4(), mC = new THREE.Matrix4(), mBase = new THREE.Matrix4();
      function updateBoMatrix() {
        // Bo sitzt auf deinem Bauch: Grundposition
        mBase.makeTranslation(0, 0, 0.15); // Knie auf der Matte, Po auf deinem Bauch
        if (tip.phi === 0) { boRoot.matrix.copy(mBase); }
        else {
          const px = tip.side * tip.b;
          boRoot.matrix.copy(mBase)
            .multiply(mA.makeTranslation(px, 0, 0))
            .multiply(mB.makeRotationZ(-tip.side * tip.phi))
            .multiply(mC.makeTranslation(-px, 0, 0));
        }
        boRoot.matrixWorldNeedsUpdate = true;
      }
      function squash() { gsap.fromTo(boUpper.scale, { x: 1.1, y: 0.9, z: 1.1 }, { x: 1, y: 1, z: 1, duration: 0.6, ease: "elastic.out(1, 0.4)" }); }

      // ---------- Kamera ----------
      let camDist = 8;
      function resize() {
        renderer.setSize(innerWidth, innerHeight, false);
        camera.aspect = innerWidth / innerHeight;
        camDist = THREE.MathUtils.clamp(Math.max(8.4, 7.4 / camera.aspect), 8.4, 15);
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);
      resize();
      const toScreen = (v) => { const p = v.clone().project(camera); return { x: (p.x * 0.5 + 0.5) * innerWidth, y: (-p.y * 0.5 + 0.5) * innerHeight }; };

      // ---------- Ton & Sprache ----------
      let soundOn = true, actx = null;
      const ensureAudio = () => { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); };
      function tone(type, f0, f1, dur, vol) {
        if (!soundOn || !actx) return;
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
        o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
      }
      const sfx = {
        bridge: (f) => tone("sine", 140, 260 + 140 * f, 0.25, 0.25),
        post: () => tone("triangle", 300, 200, 0.12, 0.14),
        grab: () => tone("triangle", 520, 780, 0.12, 0.12),
        roll: () => { tone("sine", 200, 60, 0.6, 0.35); setTimeout(() => tone("sine", 110, 40, 0.4, 0.3), 250); },
        ding: () => { tone("triangle", 880, 880, 0.35, 0.16); setTimeout(() => tone("triangle", 1320, 1320, 0.4, 0.12), 90); },
      };
      let voice = null;
      const pickVoice = () => { const vs = speechSynthesis.getVoices(); voice = vs.find((v) => v.lang === "de-DE" && /Anna|Petra|Helena|Google/.test(v.name)) || vs.find((v) => v.lang.startsWith("de")) || null; };
      if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
      function speak(text) {
        if (!soundOn || !("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/[–=]/g, ","));
        u.lang = "de-DE"; if (voice) u.voice = voice; u.rate = 0.95; u.pitch = 1.1;
        speechSynthesis.speak(u);
      }
      const soundBtn = document.getElementById("sound");
      soundBtn.addEventListener("click", () => { soundOn = !soundOn; soundBtn.textContent = soundOn ? "🔊" : "🔇"; if (!soundOn && "speechSynthesis" in window) speechSynthesis.cancel(); });

      // ---------- UI ----------
      const $ = (s) => document.querySelector(s);
      const sayEl = $("#say"), actionBtn = $("#action"), card = $("#card");
      const tagPost = $("#tagPost"), tagStep = $("#tagStep"), tagTop = $("#tagTop");
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      function say(text) {
        gsap.killTweensOf(sayEl);
        gsap.to(sayEl, { y: -10, opacity: 0, duration: 0.15, onComplete: () => { sayEl.textContent = text; gsap.fromTo(sayEl, { y: 16, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }); } });
        speak(text);
      }
      function showAction(label, onClick) {
        actionBtn.textContent = label;
        actionBtn.onclick = () => { hideAction(); onClick(); };
        actionBtn.style.pointerEvents = "auto";
        gsap.fromTo(actionBtn, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)", delay: 0.3 });
      }
      function hideAction() { actionBtn.style.pointerEvents = "none"; actionBtn.onclick = null; gsap.to(actionBtn, { opacity: 0, y: 20, duration: 0.2 }); }
      function showCard({ title = "", text = "", button, onClick, button2, onClick2, seal = false, sealIcon = "🌉", levels, topics = false }) {
        const h1 = card.querySelector("h1");
        h1.textContent = title;
        h1.classList.toggle("long", title.length > 26);
        card.querySelector("p").textContent = text;
        card.querySelector(".seal").hidden = !seal;
        card.querySelector(".seal").textContent = sealIcon;
        card.querySelector(".topics").hidden = !topics;
        const close = (fn) => () => { ensureAudio(); card.style.pointerEvents = "none"; gsap.to(card, { opacity: 0, duration: 0.3, onComplete: fn }); };
        const btn = card.querySelector(".btn.main"), alt = card.querySelector(".btn.alt");
        btn.hidden = !button; btn.textContent = button || ""; btn.onclick = close(onClick);
        alt.hidden = !button2; alt.textContent = button2 || ""; alt.onclick = close(onClick2);
        const lv = card.querySelector(".levels");
        lv.hidden = !levels;
        lv.querySelectorAll("button").forEach((b) => (b.onclick = close(() => levels(+b.dataset.level))));
        card.style.pointerEvents = "auto";
        gsap.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.35 });
        gsap.fromTo(card.querySelector(".inner"), { y: 40, scale: 0.94 }, { y: 0, scale: 1, duration: 0.6, ease: "back.out(1.8)" });
        speak([title, text].filter(Boolean).join(" "));
      }
      const starEls = [...document.querySelectorAll("#stars span")];
      function setStars(n, pop = -1) {
        starEls.forEach((s, i) => s.classList.toggle("on", i < n));
        if (pop >= 0) gsap.fromTo(starEls[pop], { scale: 0.3, rotate: -90 }, { scale: 1, rotate: 0, duration: 0.6, ease: "back.out(3)" });
      }
      const tagTargets = new Map();
      function flashTag(el, obj, lift = 0.4) {
        tagTargets.set(el, { obj, lift });
        gsap.killTweensOf(el);
        gsap.timeline().fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }).to(el, { opacity: 0, duration: 0.4, delay: 1.6 });
      }

      // ---------- Knöpfe: Brücken, Füße, Fest-Griffe ----------
      const bridgeEls = [...document.querySelectorAll(".bridge")], feetEl = $(".feet");
      const grabEls = [...document.querySelectorAll(".grab")];
      let inputOpen = false, pendingBridge = null, onResult = null;
      function setControls({ dirs = [], feet = false, grabParts = [], pulse = null }) {
        bridgeEls.forEach((el) => { el.classList.toggle("show", dirs.includes(+el.dataset.dir)); el.classList.toggle("pulse", pulse === `b${el.dataset.dir}`); });
        feetEl.classList.toggle("show", feet);
        feetEl.classList.toggle("pulse", pulse === "feet");
        feetEl.classList.toggle("on", kid.feet > 0.5);
        grabEls.forEach((el) => { el.classList.toggle("show", grabParts.includes(el.dataset.part)); el.classList.toggle("pulse", pulse === el.dataset.part); });
      }
      bridgeEls.forEach((el) => el.addEventListener("click", () => {
        ensureAudio();
        if (!inputOpen || tip.phi !== 0 || tip.rolled) return;
        bridgeEls.forEach((b) => b.classList.remove("pulse"));
        bridge(+el.dataset.dir);
      }));
      feetEl.addEventListener("click", () => {
        ensureAudio();
        if (!inputOpen || tip.phi !== 0) return;
        const close = kid.feet < 0.5;
        gsap.to(kid, { feet: close ? 1 : 0, duration: 0.35, ease: "power2.out" });
        feetEl.classList.toggle("on", close);
        feetEl.classList.remove("pulse");
        sfx.grab();
      });
      grabEls.forEach((el) => el.addEventListener("click", () => {
        ensureAudio();
        if (!inputOpen || tip.phi !== 0 || tip.rolled) return;
        const key = `${el.dataset.part}${el.dataset.side}`;
        if (el.dataset.part === "arm" && preposted === +el.dataset.side) { say("Zu weit weg – den Arm kriegst du nicht!"); return; }
        grabs[key] = !grabs[key];
        el.classList.toggle("on", grabs[key]);
        el.classList.remove("pulse");
        sfx.grab();
      }));
      function setGrab(key, on) {
        grabs[key] = on;
        const [part, side] = key.startsWith("arm") ? ["arm", key.slice(3)] : ["foot", key.slice(4)];
        grabEls.find((e) => e.dataset.part === part && e.dataset.side === side)?.classList.toggle("on", on);
      }
      function resolveBridge(rolled) {
        const p = pendingBridge;
        pendingBridge = null;
        if (rolled) {
          sfx.roll();
          shake.amp = 0.18;
          gsap.to(kid, { sitUp: 1, duration: 0.8, delay: 0.3, ease: "power2.out" });
          flashTag(tagTop, kidHead, 0.6);
        }
        onResult?.({ rolled, ...(p || {}) });
      }

      // ---------- Zurücksetzen ----------
      function resetScene({ level = 1 } = {}) {
        gsap.killTweensOf([tip, kid, bo, ...boArms, ...boLegs]);
        Object.assign(tip, { phi: 0, w: 0, side: 0, t: 0, tStart: null, rolled: false, frozen: false, b: B_KNEE });
        Object.assign(kid, { hip: 0, roll: 0, sitUp: 0, feet: level === 2 ? 0 : 1 });
        bo.hipY = level === 1 ? 1.15 : 0.95;
        boArms.forEach((a) => (a.post = 0));
        boLegs.forEach((L) => (L.step = 0));
        Object.keys(based).forEach((k) => (based[k] = false));
        Object.keys(grabs).forEach((k) => setGrab(k, false));
        preposted = 0;
        inputOpen = false;
        onResult = null;
        hideAction();
      }
      function standUp() {
        return new Promise((resolve) => {
          tip.frozen = true;
          gsap.to(kid, { sitUp: 0, hip: 0, roll: 0, duration: 0.6 });
          gsap.to(tip, {
            phi: 0, duration: 0.8, ease: "power2.inOut",
            onComplete: () => { Object.assign(tip, { w: 0, rolled: false, frozen: false, tStart: null }); resolve(); },
          });
          boArms.forEach((a) => a.s !== preposted && gsap.to(a, { post: 0, duration: 0.5 }));
          boLegs.forEach((L) => gsap.to(L, { step: 0, duration: 0.5 }));
          Object.keys(based).forEach((k) => (based[k] = k === `post${preposted}`));
        });
      }

      // ---------- Ein Versuch: warten, bis die Brücke ausgewertet ist ----------
      function attempt() { return new Promise((resolve) => { inputOpen = true; onResult = (r) => { inputOpen = false; resolve(r); }; }); }

      // ---------- Die Level ----------
      const LEVELS = {
        1: {
          name: "Zur Seite", icon: "↗",
          intro: "Bo sitzt auf dir. Wie kommst du raus?",
          setup: () => { Object.assign(reflex, { post: false, step: false }); },
          controls: { dirs: [-1, 0, 1] },
          probe: { dir: 0, say: "Gerade hoch – Bo hüpft nur!" },
          question: "Wohin musst du brücken?",
          explain: { say: "Über die Schulter – dann rollt er runter!", act: () => bridge(1) },
          practice: "Brück über die Schulter!",
          ok: (r) => r.rolled,
          fail: (r) => (r.dir === 0 ? "Gerade hoch geht nicht – zur Seite!" : "Nochmal zur Seite!"),
          title: "Brück über die Schulter!",
          task: "Üb mit deinem Trainer: Hüfte hoch und über die Schulter schauen.",
        },
        2: {
          name: "Füße an den Po", icon: "🦶",
          intro: "Bo ist jetzt schwerer. Was hilft?",
          setup: () => { Object.assign(reflex, { post: false, step: false }); },
          controls: { dirs: [-1, 1], feet: true },
          probe: { dir: 1, say: "Füße weit weg – die Brücke ist zu schwach!" },
          question: "Wie wird deine Brücke stark?",
          explain: { say: "Füße an den Po – dann drückst du mit voller Kraft!", act: async () => { gsap.to(kid, { feet: 1, duration: 0.35 }); feetEl.classList.add("on"); await wait(700); bridge(1); } },
          practice: "Füße ran – dann Brücke zur Seite!",
          before: () => { kid.feet = 0; feetEl.classList.remove("on"); },
          ok: (r) => r.rolled,
          fail: (r) => (r.force < 1 ? "Zu schwach! Erst die Füße an den Po." : "Zur Seite brücken!"),
          title: "Füße an den Po!",
          task: "Zeig deinem Trainer: Füße ganz nah am Po, dann Hüfte hoch!",
        },
        3: {
          name: "Arm fest", icon: "✋",
          intro: "Bo stützt sich jetzt mit der Hand ab!",
          setup: () => { Object.assign(reflex, { post: true, step: false }); },
          controls: { dirs: [-1, 1], grabParts: ["arm"] },
          probe: { dir: 1, say: "Er hat sich mit der Hand abgestützt!" },
          question: "Wie stoppst du seine Hand?",
          explain: { say: "Halt seinen Arm fest – dann brück zu der Seite!", act: async () => { setGrab("arm1", true); sfx.grab(); await wait(800); bridge(1); } },
          practice: "Arm fest – dann zu der Seite brücken!",
          ok: (r) => r.rolled,
          fail: (r) => (grabs[`arm${r.dir}`] ? "Nochmal!" : "Brück zu der Seite, wo du den Arm festhältst!"),
          title: "Arm fest – dann zu der Seite!",
          task: "Üb mit deinem Trainer: Arm festhalten, Brücke zu der Seite.",
        },
        4: {
          name: "Bein fest", icon: "🦵",
          intro: "Bo stellt jetzt auch den Fuß raus!",
          setup: () => { Object.assign(reflex, { post: true, step: true }); },
          controls: { dirs: [-1, 1], grabParts: ["arm", "foot"] },
          probe: { dir: 1, grab: ["arm1"], say: "Arm fest – aber er stellt den Fuß raus!" },
          question: "Was musst du noch festhalten?",
          explain: { say: "Arm UND Fuß auf derselben Seite fest – jetzt kann er nicht mehr!", act: async () => { setGrab("arm1", true); await wait(500); setGrab("foot1", true); sfx.grab(); await wait(800); bridge(1); } },
          practice: "Arm und Fuß fest – dann Brücke!",
          ok: (r) => r.rolled,
          fail: (r) => (!grabs[`arm${r.dir}`] ? "Seine Hand! Halt den Arm auf der Seite fest." : !grabs[`foot${r.dir}`] ? "Sein Fuß! Halt auch den Fuß auf der Seite fest." : "Nochmal!"),
          title: "Arm fest, Fuß fest, Brücke!",
          task: "Zeig deinem Trainer: Arm und Fuß auf einer Seite fangen und rüberrollen!",
        },
        5: {
          name: "Alles zusammen", icon: "🌉",
          intro: "Bo stützt sich schon auf einer Seite ab. Wohin jetzt?",
          setup: () => { Object.assign(reflex, { post: true, step: true }); },
          controls: { dirs: [-1, 1], grabParts: ["arm", "foot"], feet: true },
          practice: "Schau, wo er sich abstützt – und brück zur anderen Seite!",
          before: () => {
            kid.feet = Math.random() < 0.5 ? 0 : 1;
            feetEl.classList.toggle("on", kid.feet > 0.5);
            preposted = Math.random() < 0.5 ? -1 : 1;
            boArms[preposted > 0 ? 1 : 0].post = 1;
            Object.keys(based).forEach((k) => (based[k] = k === `post${preposted}`));
          },
          ok: (r) => r.rolled,
          fail: (r) => (r.dir === preposted ? "Da stützt er sich ab – brück zur anderen Seite!" : r.force < 1 ? "Füße an den Po!" : "Arm und Fuß auf der Seite festhalten!"),
          title: "Arm fest, Fuß fest, Brücke zur Seite!",
          task: "Zeig deinem Trainer deine beste Brücke – auf beide Seiten!",
        },
      };

      const flow = {
        start() {
          resetScene();
          setControls({});
          showCard({ seal: true, title: "Die Brücke", topics: true, text: "Welches Level übst du?", levels: (n) => flow.level(n) });
        },

        level(n) {
          const L = LEVELS[n];
          resetScene({ level: n });
          L.setup();
          setControls({});
          showCard({ seal: true, sealIcon: L.icon, title: `Level ${n}`, text: L.intro, button: "Los!", onClick: () => (n === 5 ? flow.practice(n, 0) : flow.probe(n)) });
        },

        // Probe: das Kind sieht, was ohne das Neue passiert (wir machen es vor)
        async probe(n) {
          const L = LEVELS[n];
          say("Schau zu!");
          await wait(900);
          (L.probe.grab || []).forEach((k) => setGrab(k, true));
          await wait(L.probe.grab ? 600 : 0);
          const res = new Promise((resolve) => (onResult = resolve));
          bridge(L.probe.dir);
          await res;
          say(L.probe.say);
          await wait(2200);
          showCard({ title: L.question, button: "Zeig's mir", onClick: () => flow.explain(n) });
        },

        // Zeitlupe: so geht's richtig
        async explain(n) {
          const L = LEVELS[n];
          await standUp();
          Object.keys(grabs).forEach((k) => setGrab(k, false));
          L.before?.();
          setControls(L.controls);
          say(L.explain.say);
          await wait(1400);
          tip.timeScale = 0.4;
          const res = new Promise((resolve) => (onResult = resolve));
          await L.explain.act();
          await res;
          tip.timeScale = 1;
          await wait(1200);
          showAction("Jetzt du!", async () => { await standUp(); flow.practice(n, 0); });
        },

        // drei Versuche mit Sternen
        async practice(n, round, stars = 0, tries = 0) {
          const L = LEVELS[n];
          Object.keys(grabs).forEach((k) => setGrab(k, false));
          if (n === 5) { boArms.forEach((a) => (a.post = 0)); preposted = 0; }
          L.before?.();
          const firstHint = round === 0 && tries === 0;
          setControls({ ...L.controls, pulse: firstHint ? (n === 2 ? "feet" : n === 3 ? "arm" : n === 4 ? "foot" : n === 1 ? "b1" : null) : null });
          gsap.to("#stars", { opacity: 1, duration: 0.3 });
          setStars(stars);
          if (tries === 0) say(round === 0 ? L.practice : ["", "Nochmal!", "Letzte Runde!"][round]);
          const r = await attempt();
          await wait(600);
          if (L.ok(r)) {
            stars += tries === 0 ? 1 : 0; // Stern nur beim ersten Versuch der Runde
            setStars(stars, tries === 0 ? stars - 1 : -1);
            sfx.ding();
            say(tries === 0 ? "Super! Du bist oben!" : "Geschafft!");
            await wait(1800);
            await standUp();
            if (round < 2) flow.practice(n, round + 1, stars, 0);
            else flow.end(n, stars);
          } else {
            say(L.fail(r));
            await wait(1600);
            await standUp();
            flow.practice(n, round, stars, tries + 1);
          }
        },

        end(n, stars) {
          const L = LEVELS[n];
          gsap.to("#stars", { opacity: 0, duration: 0.3 });
          setControls({});
          showCard({
            seal: true, sealIcon: L.icon, title: L.title, text: L.task,
            button: n < 5 ? `Level ${n + 1}!` : "Nochmal", onClick: () => flow.level(n < 5 ? n + 1 : 5),
            button2: stars < 2 ? "Nochmal üben" : "Level wählen", onClick2: stars < 2 ? () => flow.level(n) : flow.start,
          });
        },
      };
      $("#levelBtn").addEventListener("click", () => { ensureAudio(); flow.start(); });

      // ---------- Animationsschleife ----------
      const clock = new THREE.Clock();
      const grabPos = { "arm-1": () => boArmWorld(-1), arm1: () => boArmWorld(1), "foot-1": () => boFootWorld(-1), foot1: () => boFootWorld(1) };
      function tick() {
        const dt = Math.min(clock.getDelta(), 1 / 30);
        applyBo();
        stepTip(dt * tip.timeScale);
        updateBoMatrix();
        boRoot.updateMatrixWorld(true);
        applyKid();

        // Kamera: von deinem Kopf aus auf Bo, wackelt beim Runterrollen
        shake.amp *= Math.exp(-dt * 7);
        camera.position.set((Math.random() - 0.5) * shake.amp, 0.62 * camDist + (Math.random() - 0.5) * shake.amp, 0.78 * camDist);
        camera.lookAt(camLook);

        // Fest-Punkte und Griff-Ringe an Bos Arm/Fuß heften
        for (const el of grabEls) {
          const key = `${el.dataset.part}${el.dataset.side}`;
          const s = +el.dataset.side;
          const p = grabPos[key]();
          // Knopf gut erreichbar: Arm am Ellbogen außen, Fuß unten neben Bos Knie
          const anchor = el.dataset.part === "arm" ? boArms[s > 0 ? 1 : 0].upper.getWorldPosition(vB) : boLegs[s > 0 ? 1 : 0].knee.getWorldPosition(vB);
          const sp = toScreen(anchor);
          el.style.left = sp.x + s * (el.dataset.part === "arm" ? 46 : 70) + "px";
          el.style.top = sp.y + (el.dataset.part === "arm" ? -10 : 34) + "px";
          const ring = grabMarks[key];
          ring.visible = grabs[key];
          ring.position.copy(p);
          ring.lookAt(camera.position);
        }
        for (const [el, { obj, lift }] of tagTargets) {
          obj.getWorldPosition(vA);
          vA.y += lift;
          const p = toScreen(vA);
          el.style.left = p.x + "px";
          el.style.top = p.y + "px";
        }
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
      flow.start();

      // Zum Testen in der Konsole
      window.bruecke = { tip, kid, bo, grabs, reflex, based, bridge, setGrab, flow, LEVELS, boArms, boLegs };
    </script>
  </body>
</html>

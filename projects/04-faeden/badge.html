<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fäden · Badge</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <style>
      /* Einleger für die Badge-Hülle, 90 × 120 mm. Drucken mit 100 %, ohne Ränder. */
      @page { size: 90mm 120mm; margin: 0; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #ececec; font: 400 10pt/1.35 "Geist", system-ui, sans-serif; color: #16130f; }
      .card {
        width: 90mm; height: 120mm; margin: 24px auto; background: #fff;
        padding: 9mm; display: flex; flex-direction: column;
      }
      .top { display: flex; justify-content: space-between; font-size: 8pt; color: rgba(22,19,15,.5); }
      h1 { margin: 7mm 0 5mm; font: italic 400 30pt/.95 "Instrument Serif", serif; }
      .qr { width: 44mm; height: 44mm; }
      .qr svg { width: 100%; height: 100%; display: block; }
      .qr svg path, .qr svg rect[fill="black"] { fill: #cf1830; }
      .foot { margin-top: auto; }
      .foot strong { font-weight: 500; }
      .foot span { color: rgba(22,19,15,.5); }
      @media print { body { background: none; } .card { margin: 0; } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top"><span>madebymaga</span><span>code.talks 2026</span></div>
      <h1>Was tut dir hier gut?</h1>
      <div class="qr" id="qr"></div>
      <p class="foot"><strong>Maga</strong> · Feel Good Manager<br /><span>Scannen, ein Wort, ein roter Faden.</span></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script type="module">
      import { mitmachUrl } from "./store.js";
      const qr = qrcode(0, "M");
      qr.addData(mitmachUrl());
      qr.make();
      document.querySelector("#qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    </script>
  </body>
</html>

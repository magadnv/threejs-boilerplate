<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js · Flow Field · Scroll</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        background: #050507;
        color: #eae6dd;
        font-family: "Instrument Serif", Georgia, serif;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #story section {
        position: relative;
        height: 100vh;
        display: grid;
        align-items: end;
        padding: 0 6vw 10vh;
        font-size: clamp(28px, 4vw, 56px);
        font-style: italic;
        mix-blend-mode: difference; /* bleibt auf Nacht und Papier lesbar */
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <main id="story">
      <section>Alles beginnt geordnet.</section>
      <section>Dann bekommt es Strömung.</section>
      <section>Und Wärme.</section>
      <section>Bis es Tinte wird.</section>
    </main>
    <script type="module" src="./src/scroll-demo.js"></script>
  </body>
</html>

      {

      }
    </script>
    <style>
      /* ---------- Farben & Grundlagen ---------- */
      :root {
        --bg: #f1eee8;
        --ink: #141414;
        --mute: #77736c;
        --line: #d9d4ca;
        --red: #cf1830;

      /* ---------- Modus-Umschalter (gleich in allen drei Seiten) ---------- */
      .modes {
        position: fixed; left: 50%; top: calc(12px + var(--safe-top)); transform: translateX(-50%); z-index: 6;
        display: flex; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.7);

      }
      .modes a {
        padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500;
        color: var(--mute); text-decoration: none; white-space: nowrap;
      }
      .modes a[aria-current="page"] { background: var(--ink); color: #fff; }
      .modes a:not([aria-current]):hover { color: var(--ink); }

      /* ---------- Satz oben (max. ein Satz pro Screen) ---------- */
      #say {
        position: fixed; left: 16px; right: 16px; top: calc(70px + var(--safe-top));
        text-align: center; line-height: 1.1; pointer-events: none; text-wrap: balance;
        font-size: clamp(26px, 4.2vw, 46px);
      }
      #say em { color: var(--red); }
      #meta {
        position: fixed; left: 20px; bottom: calc(20px + var(--safe-bottom));
        font-size: 13px; letter-spacing: 0.04em; color: var(--mute);
      }

      /* ---------- Knöpfe ---------- */
      button { font-family: inherit; cursor: pointer; border: 0; }
      .btn {
        background: var(--ink); color: #fff; font-size: 17px; font-weight: 500; letter-spacing: 0.01em;
        padding: 16px 30px; border-radius: 999px; transition: transform 0.12s, background 0.2s;
      }
      .btn:hover { background: var(--red); }
      .btn:active { transform: scale(0.97); }
      .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
      .btn.ghost:hover { background: var(--ink); color: #fff; }
      #actions {
        position: fixed; left: 50%; bottom: calc(26px + var(--safe-bottom)); transform: translateX(-50%);
        display: flex; gap: 10px; z-index: 3;
      }
      #actions .btn { opacity: 0; pointer-events: none; }
      #sound {
        position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(12px + var(--safe-top));
        width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.7);
        border: 1px solid var(--line); font-size: 18px; z-index: 6;
      }

      /* ---------- Karte ---------- */
      #card {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 4;
        background: rgba(241, 238, 232, 0.82); backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px); opacity: 0; pointer-events: none;
      }
      #card .inner { text-align: center; padding: 16px; max-width: 860px; }
      #card .k { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--red); margin-bottom: 18px; }
      #card h1 { margin: 0 0 18px; line-height: 0.98; font-size: clamp(52px, 10vw, 128px); text-wrap: balance; }
      #card h1.long { font-size: clamp(40px, 6.6vw, 84px); }
      #card p { margin: 0 auto 34px; line-height: 1.4; max-width: 560px; font-size: clamp(17px, 2.4vw, 21px); color: #3a3833; text-wrap: balance; }

      /* ---------- Kraft-Anzeige beim Ziehen ---------- */
      #forceTag {
        position: fixed; padding: 6px 10px; border-radius: 4px; background: var(--ink); color: #fff;
        font-size: 14px; pointer-events: none; opacity: 0; transform: translate(-50%, -140%); white-space: nowrap; z-index: 2;
      }
      .tag {
        position: fixed; font-size: 19px; font-style: italic; pointer-events: none; opacity: 0;
        transform: translate(-50%, -50%); white-space: nowrap; z-index: 2; color: var(--red);
      }

  <body>
    <canvas id="scene"></canvas>

    <!-- Modus-Umschalter -->
    <nav class="modes" aria-label="Altersstufe">

    <div id="say" class="serif" aria-live="polite"></div>

    <button id="sound" aria-label="Sprachausgabe an oder aus">🔇</button>
    <div id="actions"><button id="a1" class="btn"></button><button id="a2" class="btn ghost"></button></div>
    <div id="forceTag" class="mono"></div>
    <div id="tagLine" class="tag serif">Linie seiner Füße</div>
    <div id="tagLeg" class="tag serif">das dritte Bein</div>

    <div id="card"><div class="inner">
      <div class="k"></div>
      <h1 class="serif"></h1>
      <p></p>
      <button class="btn"></button>
    </div></div>

    <script type="module">
      import * as THREE from "three";

      /* =====================================================================
         DAS DRITTE BEIN · Erwachsene
         Ein Satz: „Wirf ihn dorthin, wo kein Fuß steht.“

         Zwei Füße bilden eine lange, schmale Basis. Entlang der Fußlinie ist er
         stabil, senkrecht dazu liegt die Kante ganz nah am Schwerpunkt – dort
         „fehlt das dritte Bein“ eines Stativs.

         Physik (wie Level Kinder/Teens, jetzt in 2D):
         - Basis = konvexe Hülle beider Füße (Draufsicht).
         - Ein Schubs in Richtung d trifft die Kante, auf die der Strahl vom
           Schwerpunkt zeigt. Um diese Kante kippt er als Kippblock:
             b = Abstand Schwerpunkt → Kante,  α = atan(b / h)
             φ'' = −p² · sin(α − φ),  p² = 3g / (4R)
         - Nur der Anteil des Schubs senkrecht zur Kante (d · n) wirkt.
         - Die Kraftkarte zeigt je Richtung die kleinste Kraft, die ihn wirft –
           numerisch mit genau diesem Integrator berechnet.
         ===================================================================== */

      // ---------- Einstellungen ----------
      const G = 9.81;
      const THIGH = 0.75;
      const HIP_Y = 1.05;
      const H = HIP_Y + 0.45;       // Schwerpunkt-Höhe
      const HIP_HALF = 0.18;
      const FOOT_L = 0.24, FOOT_W = 0.11; // halbe Fußlänge / -breite
      const K = 1.1;
      const MAX_S = 2.0;            // 100 % Kraft
      const DRAG_TO_S = 0.6;        // Weltmeter Ziehen → Kraft
      const MAP_R0 = 0.35, MAP_K = 1.0; // Radius auf der Matte = R0 + Kraft·K
      const COLORS = {
        bg: 0xf1eee8, mat: 0xe9e4db, matEdge: 0xcf1830, ink: 0x141414,
        gi: 0x24324f, skin: 0xcfc9c0, belt: 0x5a3a22, red: 0xcf1830, ok: 0x1f8f55, warn: 0xd98a00,
      };

      // ---------- Renderer, Szene, Kamera ----------
      const canvas = document.getElementById("scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(COLORS.bg);
      scene.fog = new THREE.Fog(COLORS.bg, 16, 30);
      const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
      const camLook = new THREE.Vector3(0, 0.4, 0);

      scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d0c2, 1.7));
      const sun = new THREE.DirectionalLight(0xffffff, 1.9);
      sun.position.set(-3, 10, 4);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 25 });
      sun.shadow.radius = 5;
      scene.add(sun);

      // ---------- Matte mit Kompass-Strichen ----------
      const mat = new THREE.Mesh(new THREE.BoxGeometry(12, 0.2, 12), new THREE.MeshStandardMaterial({ color: COLORS.mat, roughness: 0.95 }));
      mat.position.y = -0.1;
      mat.receiveShadow = true;
      scene.add(mat);
      const edgeLine = new THREE.Mesh(new THREE.RingGeometry(3.05, 3.09, 128), new THREE.MeshBasicMaterial({ color: 0xb9b2a6 }));
      edgeLine.rotation.x = -Math.PI / 2;
      edgeLine.position.y = 0.003;
      scene.add(edgeLine);
      {
        const pts = [];
        for (let i = 0; i < 72; i++) {
          const a = (i / 72) * Math.PI * 2, r0 = i % 9 === 0 ? 2.75 : 2.88;
          pts.push(new THREE.Vector3(Math.cos(a) * r0, 0.004, Math.sin(a) * r0), new THREE.Vector3(Math.cos(a) * 2.98, 0.004, Math.sin(a) * 2.98));
        }
        scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xa9a297 })));
      }

      // ---------- Stellung: Fußpositionen, Hülle, Kanten ----------
      const stance = { yaw: 0.35, sx: 0.22, sz: 0.38 };
      let hull = [];      // Basis-Ecken in Weltkoordinaten (x, z), gegen den Uhrzeigersinn
      let feetWorld = []; // Mittelpunkte der Füße (Welt)

      const rot2 = (x, z, a) => [x * Math.cos(a) + z * Math.sin(a), -x * Math.sin(a) + z * Math.cos(a)];
      function footLocal(side) {
        // side −1 = linker Fuß (vorne), +1 = rechter Fuß (hinten)
        return { x: side * stance.sx, z: -side * stance.sz, turn: side * 0.25 };
      }
      function convexHull(points) {
        const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
        const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
        const lower = [], upper = [];
        for (const q of p) { while (lower.length >= 2 && cross(lower.at(-2), lower.at(-1), q) <= 0) lower.pop(); lower.push(q); }
        for (const q of p.reverse()) { while (upper.length >= 2 && cross(upper.at(-2), upper.at(-1), q) <= 0) upper.pop(); upper.push(q); }
        return lower.slice(0, -1).concat(upper.slice(0, -1));
      }
      function updateHull() {
        const pts = [];
        feetWorld = [];
        for (const side of [-1, 1]) {
          const f = footLocal(side);
          for (const [cx, cz] of [[-FOOT_W, -FOOT_L], [FOOT_W, -FOOT_L], [FOOT_W, FOOT_L], [-FOOT_W, FOOT_L]]) {
            const [rx, rz] = rot2(cx, cz, f.turn);
            pts.push(rot2(f.x + rx, f.z + rz, stance.yaw));
          }
          feetWorld.push(rot2(f.x, f.z, stance.yaw));
        }
        hull = convexHull(pts);
      }

      // Strahl vom Schwerpunkt (Ursprung) in Richtung d → getroffene Kante
      function rayEdge(dx, dz) {
        for (let i = 0; i < hull.length; i++) {
          const p = hull[i], q = hull[(i + 1) % hull.length];
          const ex = q[0] - p[0], ez = q[1] - p[1];
          const den = dx * ez - dz * ex;
          if (Math.abs(den) < 1e-9) continue;
          const t = (p[0] * ez - p[1] * ex) / den;
          const u = (p[0] * dz - p[1] * dx) / den;
          if (t > 0 && u >= -1e-6 && u <= 1 + 1e-6) {
            let nx = ez, nz = -ex;
            const l = Math.hypot(nx, nz);
            nx /= l; nz /= l;
            if (nx * p[0] + nz * p[1] < 0) { nx = -nx; nz = -nz; }
            return { nx, nz, b: nx * p[0] + nz * p[1] };
          }
        }
        return { nx: dx, nz: dz, b: 0.3 };
      }

      // ---------- Mindestkraft je Richtung (gleicher Integrator wie das Spiel) ----------
      const omegaCache = new Map();
      function omegaThreshold(b) {
        const key = b.toFixed(3);
        if (omegaCache.has(key)) return omegaCache.get(key);
        const R = Math.hypot(b, H), alpha = Math.atan2(b, H), p2 = (3 * G) / (4 * R);
        const tips = (w0) => {
          let phi = 0, w = w0;
          const dt = 1 / 300;
          for (let i = 0; i < 3000; i++) {
            w += -p2 * Math.sin(alpha - phi) * dt;
            w *= 1 - 0.8 * dt;
            phi += w * dt;
            if (phi > alpha) return true;
            if (w <= 0) return false;
          }
          return false;
        };
        let lo = 0, hi = 4;
        for (let i = 0; i < 18; i++) { const m = (lo + hi) / 2; tips(m) ? (hi = m) : (lo = m); }
        omegaCache.set(key, hi);
        return hi;
      }
      function minForce(dx, dz) {
        const e = rayEdge(dx, dz);
        const comp = dx * e.nx + dz * e.nz;
        return (omegaThreshold(e.b) * (e.b * e.b + H * H)) / (K * H * Math.max(comp, 0.05));
      }
      // ganze Kraftkarte (für Anzeige und Wertung)
      let forceMap = [];
      function computeMap() {
        forceMap = [];
        for (let i = 0; i < 180; i++) {
          const a = (i / 180) * Math.PI * 2;
          forceMap.push({ a, s: minForce(Math.cos(a), Math.sin(a)) });
        }
        return forceMap;
      }
      const bestForce = () => Math.min(...forceMap.map((m) => m.s));

      // ---------- Der Gegner ----------
      const toon = (color, rough = 0.6) => new THREE.MeshStandardMaterial({ color, roughness: rough, flatShading: true });
      const mGi = toon(COLORS.gi), mSkin = toon(COLORS.skin, 0.45), mBelt = toon(COLORS.belt, 0.8);
      const ico = (r, d = 1) => new THREE.IcosahedronGeometry(r, d);
      const shadowy = (m) => ((m.castShadow = true), m);

      const figure = new THREE.Group();        // kippt über die Matrix
      figure.matrixAutoUpdate = false;
      scene.add(figure);
      const body = new THREE.Group();          // dreht sich in die Stellung (yaw)
      figure.add(body);

      const upper = new THREE.Group();
      upper.position.y = HIP_Y;
      body.add(upper);
      const torso = shadowy(new THREE.Mesh(ico(1, 2), mGi));
      torso.scale.set(0.58, 0.64, 0.44);
      torso.position.y = 0.42;
      upper.add(torso);
      const belt = shadowy(new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.065, 6, 20), mBelt));
      belt.rotation.x = Math.PI / 2;
      belt.scale.set(1.06, 0.82, 1);
      belt.position.y = 0.2;
      upper.add(belt);
      const head = shadowy(new THREE.Mesh(ico(0.37, 2), mSkin));
      head.position.set(0, 1.2, 0.03);
      upper.add(head);
      for (const s of [-1, 1]) {
        const pivot = new THREE.Group();
        pivot.position.set(s * 0.54, 0.74, 0.05);
        const arm = shadowy(new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.42, 3, 8), mGi));
        arm.position.y = -0.26;
        const hand = shadowy(new THREE.Mesh(ico(0.11, 1), mSkin));
        hand.position.y = -0.56;
        pivot.add(arm, hand);
        pivot.rotation.set(-0.9, 0, s * 0.25); // Hände vorne, bereit zum Greifen
        upper.add(pivot);
      }
      const limbGeo = new THREE.CylinderGeometry(1, 1, 1, 8);
      const legs = [-1, 1].map((side) => {
        const thigh = shadowy(new THREE.Mesh(limbGeo, mGi));
        const shin = shadowy(new THREE.Mesh(limbGeo, mGi));
        thigh.scale.set(0.15, 1, 0.15);
        shin.scale.set(0.12, 1, 0.12);
        const knee = shadowy(new THREE.Mesh(ico(0.14, 1), mGi));
        const foot = shadowy(new THREE.Mesh(ico(1, 1), mSkin));
        foot.scale.set(FOOT_W, 0.08, FOOT_L);
        body.add(thigh, shin, knee, foot);
        return { side, thigh, shin, knee, foot };
      });

      const UP = new THREE.Vector3(0, 1, 0), tmpV = new THREE.Vector3();
      function placeLimb(mesh, a, b) {
        mesh.position.copy(a).add(b).multiplyScalar(0.5);
        tmpV.copy(b).sub(a);
        mesh.scale.y = tmpV.length();
        mesh.quaternion.setFromUnitVectors(UP, tmpV.normalize());
      }
      function applyStance() {
        body.rotation.y = stance.yaw;
        for (const L of legs) {
          const f = footLocal(L.side);
          const Hp = new THREE.Vector3(L.side * HIP_HALF, HIP_Y, 0);
          const F = new THREE.Vector3(f.x, 0.11, f.z);
          const d = Math.min(Hp.distanceTo(F), 2 * THIGH - 0.001);
          const u = F.clone().sub(Hp).normalize();
          const v = new THREE.Vector3(L.side * 0.3, 0, 1); // Knie nach vorne, leicht außen
          v.addScaledVector(u, -v.dot(u)).normalize();
          const Kp = Hp.clone().add(F).multiplyScalar(0.5).addScaledVector(v, Math.sqrt(THIGH * THIGH - (d / 2) ** 2));
          placeLimb(L.thigh, Hp, Kp);
          placeLimb(L.shin, Kp, F);
          L.knee.position.copy(Kp);
          L.foot.position.set(f.x, 0.07, f.z + 0.04);
          L.foot.rotation.y = f.turn;
        }
      }

      // ---------- Basis-Fläche (Hülle) als Linie + Füllung ----------
      const hullFill = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ color: COLORS.ink, transparent: true, opacity: 0.07, depthWrite: false }));
      const hullLine = new THREE.LineLoop(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: COLORS.ink }));
      scene.add(hullFill, hullLine);
      function drawHull() {
        const pts = hull.map(([x, z]) => new THREE.Vector3(x, 0.006, z));
        hullLine.geometry.setFromPoints(pts);
        const shape = new THREE.Shape(hull.map(([x, z]) => new THREE.Vector2(x, -z)));
        hullFill.geometry.dispose();
        hullFill.geometry = new THREE.ShapeGeometry(shape);
        hullFill.rotation.x = -Math.PI / 2;
        hullFill.position.y = 0.005;
      }

      // ---------- Kraftkarte (Polar-Kurve auf der Matte) ----------
      const mapGroup = new THREE.Group();
      mapGroup.visible = false;
      scene.add(mapGroup);
      const mapMat = new THREE.MeshBasicMaterial({ color: COLORS.red, transparent: true, depthWrite: false, depthTest: false }); // über der Figur, damit die Karte ganz lesbar bleibt
      const mapFillMat = new THREE.MeshBasicMaterial({ color: COLORS.red, transparent: true, opacity: 0.08, depthWrite: false });
      let mapTube = null, mapFill = null;
      const mapR = (s) => MAP_R0 + Math.min(s, MAX_S * 1.2) * MAP_K;
      function buildMapMesh() {
        mapTube?.geometry.dispose();
        mapFill?.geometry.dispose();
        mapGroup.clear();
        const pts = forceMap.map(({ a, s }) => new THREE.Vector3(Math.cos(a) * mapR(s), 0.02, Math.sin(a) * mapR(s)));
        const curve = new THREE.CatmullRomCurve3(pts, true);
        mapTube = new THREE.Mesh(new THREE.TubeGeometry(curve, 360, 0.018, 5, true), mapMat);
        mapTube.renderOrder = 12;
        const shape = new THREE.Shape(pts.map((p) => new THREE.Vector2(p.x, -p.z)));
        mapFill = new THREE.Mesh(new THREE.ShapeGeometry(shape), mapFillMat);
        mapFill.rotation.x = -Math.PI / 2;
        mapFill.position.y = 0.012;
        mapGroup.add(mapFill, mapTube);
      }
      const figMats = [mGi, mSkin, mBelt];
      figMats.forEach((m) => (m.transparent = true));
      function ghostFigure(on) {
        gsap.to(figMats, { opacity: on ? 0.35 : 1, duration: 0.5 });
      }
      function revealMap(on = true, duration = 1.6) {
        ghostFigure(on);
        if (!on) {
          gsap.to([mapMat, mapFillMat], { opacity: 0, duration: 0.4, onComplete: () => (mapGroup.visible = false) });
          return;
        }
        buildMapMesh();
        mapGroup.visible = true;
        mapMat.opacity = 1;
        mapFillMat.opacity = 0.08;
        const count = mapTube.geometry.index.count;
        const prog = { v: 0 };
        mapTube.geometry.setDrawRange(0, 0);
        gsap.fromTo(mapFillMat, { opacity: 0 }, { opacity: 0.08, duration, delay: duration * 0.5 });
        gsap.to(prog, { v: 1, duration, ease: "power2.inOut", onUpdate: () => mapTube.geometry.setDrawRange(0, Math.floor((prog.v * count) / 3) * 3) });
      }

      // Versuchs-Marken: Punkt in Schubrichtung, Abstand = eingesetzte Kraft
      const marks = new THREE.Group();
      scene.add(marks);
      const markGeo = new THREE.CircleGeometry(0.07, 18);
      function addMark(a, s, fell) {
        const m = new THREE.Mesh(markGeo, new THREE.MeshBasicMaterial({ color: fell ? COLORS.red : COLORS.ink, transparent: true, depthTest: false }));
        m.renderOrder = 12;
        m.rotation.x = -Math.PI / 2;
        m.position.set(Math.cos(a) * mapR(s), 0.025, Math.sin(a) * mapR(s));
        marks.add(m);
        gsap.from(m.scale, { x: 0, y: 0, z: 0, duration: 0.5, ease: "back.out(3)" });
      }
      function clearMarks() { marks.children.forEach((m) => m.material.dispose()); marks.clear(); }

      // Fußlinie + „drittes Bein“ (Stativ) für die Erklärung
      const tripod = new THREE.Group();
      tripod.visible = false;
      scene.add(tripod);
      const dashMat = new THREE.LineDashedMaterial({ color: COLORS.red, dashSize: 0.08, gapSize: 0.06 });
      const legPoints = [new THREE.Vector3(), new THREE.Vector3()];
      function buildTripod() {
        tripod.clear();
        const [a, b] = feetWorld;
        const fx = b[0] - a[0], fz = b[1] - a[1];
        const l = Math.hypot(fx, fz);
        const px = -fz / l, pz = fx / l; // senkrecht zur Fußlinie
        const D = 1.1;
        const footLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(a[0] - fx * 0.6, 0.03, a[1] - fz * 0.6), new THREE.Vector3(b[0] + fx * 0.6, 0.03, b[1] + fz * 0.6),
        ]), new THREE.LineBasicMaterial({ color: COLORS.ink }));
        tripod.add(footLine);
        [1, -1].forEach((sgn, i) => {
          const tip = new THREE.Vector3(px * D * sgn, 0.03, pz * D * sgn);
          legPoints[i].copy(tip);
          const geo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(a[0], 0.03, a[1]), tip, new THREE.Vector3(b[0], 0.03, b[1]),
          ]);
          const line = new THREE.Line(geo, dashMat);
          line.computeLineDistances();
          const ghost = new THREE.Mesh(new THREE.RingGeometry(0.1, 0.14, 24), new THREE.MeshBasicMaterial({ color: COLORS.red }));
          ghost.rotation.x = -Math.PI / 2;
          ghost.position.copy(tip);
          tripod.add(line, ghost);
        });
      }

      // ---------- Physik: Kippen um die getroffene Kante ----------
      const phys = { phi: 0, w: 0, edge: null, fallen: false, frozen: false, lost: false, lie: Math.PI / 2, timeScale: 1 };

      function lieAngle(b) {
        const yT = HIP_Y + 0.42, yH = HIP_Y + 1.2;
        for (let a = Math.atan2(b, H); a < Math.PI / 2; a += 0.005) {
          const s = Math.sin(a), c = Math.cos(a);
          if (b * s + yT * c <= 0.5 || b * s + yH * c <= 0.37) return a;
        }
        return Math.PI / 2;
      }

      function push(dx, dz, s) {
        const l = Math.hypot(dx, dz);
        dx /= l; dz /= l;
        if (!phys.edge || (phys.phi === 0 && phys.w === 0)) phys.edge = rayEdge(dx, dz);
        const e = phys.edge;
        const comp = dx * e.nx + dz * e.nz;
        phys.w += (K * s * comp * H) / (e.b * e.b + H * H);
        sfx.push(s);
      }

      function stepOnce(dt) {
        const e = phys.edge;
        if (!e || (phys.phi === 0 && phys.w === 0)) return;
        const R = Math.hypot(e.b, H), alpha = Math.atan2(e.b, H), p2 = (3 * G) / (4 * R);
        phys.w += -p2 * Math.sin(alpha - phys.phi) * dt;
        phys.w *= 1 - 0.8 * dt;
        let next = phys.phi + phys.w * dt;
        if (next < 0) {
          // Zurückschwingen: Aufprall, dann kippt er leicht über die Gegenkante
          const eRest = Math.max(0.5, 1 - 1.5 * Math.sin(alpha) ** 2);
          phys.w = -phys.w * eRest;
          phys.edge = rayEdge(-e.nx, -e.nz);
          next = -next;
        }
        phys.phi = next;
        if (phys.phi < 0.003 && Math.abs(phys.w) < 0.05) phys.phi = phys.w = 0;
        if (!phys.lost && phys.phi > alpha) {
          phys.lost = true;
          phys.lie = lieAngle(e.b);
          hooks.onLost?.();
        }
        if (phys.phi >= phys.lie) land();
      }
      function stepPhysics(dt) {
        if (phys.fallen || phys.frozen) return;
        const n = Math.ceil(dt / (1 / 300));
        for (let i = 0; i < n && !phys.fallen; i++) stepOnce(dt / n);
      }

      function land() {
        phys.phi = phys.lie;
        phys.w = 0;
        phys.fallen = true;
        shake.amp = 0.12;
        sfx.thud();
        hooks.onLand?.();
      }
      function standUp(duration = 0.8) {
        return new Promise((resolve) => {
          phys.frozen = true;
          gsap.to(phys, {
            phi: 0, duration, ease: "power3.inOut",
            onComplete: () => {
              Object.assign(phys, { phi: 0, w: 0, edge: null, fallen: false, frozen: false, lost: false, lie: Math.PI / 2 });
              resolve();
            },
          });
        });
      }

      // Neue Stellung einnehmen (weicher Schritt)
      function newStance(target, duration = 0.9) {
        return new Promise((resolve) => {
          gsap.to(stance, {
            ...target, duration, ease: "power2.inOut",
            onUpdate: () => { updateHull(); drawHull(); },
            onComplete: () => { updateHull(); drawHull(); computeMap(); resolve(); },
          });
        });
      }
      function randomStance(prevYaw = 0) {
        return {
          yaw: prevYaw + (Math.random() < 0.5 ? -1 : 1) * (0.9 + Math.random() * 1.6),
          sx: 0.16 + Math.random() * 0.16,
          sz: (Math.random() < 0.5 ? -1 : 1) * (0.2 + Math.random() * 0.3),
        };
      }

      // ---------- Figur um die Kante drehen ----------
      const mA = new THREE.Matrix4(), mB = new THREE.Matrix4(), axis = new THREE.Vector3();
      function updateFigure() {
        const e = phys.edge;
        if (!e || phys.phi === 0) { figure.matrix.identity(); }
        else {
          axis.set(e.nz, 0, -e.nx);
          const px = e.nx * e.b, pz = e.nz * e.b;
          figure.matrix.makeTranslation(px, 0, pz).multiply(mA.makeRotationAxis(axis, phys.phi)).multiply(mB.makeTranslation(-px, 0, -pz));
        }
        figure.matrixWorldNeedsUpdate = true;
      }

      // ---------- Schwerpunkt + Lot ----------
      const comBall = new THREE.Mesh(new THREE.SphereGeometry(0.1, 20, 14), new THREE.MeshBasicMaterial({ color: COLORS.red, depthTest: false }));
      comBall.renderOrder = 10;
      scene.add(comBall);
      const plumb = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), new THREE.LineDashedMaterial({ color: COLORS.red, dashSize: 0.06, gapSize: 0.05, depthTest: false }));
      plumb.renderOrder = 9;
      scene.add(plumb);
      const groundDot = new THREE.Mesh(new THREE.RingGeometry(0.06, 0.1, 20), new THREE.MeshBasicMaterial({ color: COLORS.red, depthTest: false }));
      groundDot.rotation.x = -Math.PI / 2;
      groundDot.renderOrder = 9;
      scene.add(groundDot);
      const comWorld = new THREE.Vector3();
      function updateIndicator() {
        comWorld.set(0, H, 0).applyMatrix4(figure.matrix);
        comBall.position.copy(comWorld);
        const pos = plumb.geometry.attributes.position;
        pos.setXYZ(0, comWorld.x, comWorld.y, comWorld.z);
        pos.setXYZ(1, comWorld.x, 0.02, comWorld.z);
        pos.needsUpdate = true;
        plumb.computeLineDistances();
        groundDot.position.set(comWorld.x, 0.02, comWorld.z);
      }

      // ---------- Zug-Pfeil beim Ziehen ----------
      const arrowShape = new THREE.Shape();
      arrowShape.moveTo(0, -0.035); arrowShape.lineTo(0.86, -0.035); arrowShape.lineTo(0.86, -0.1);
      arrowShape.lineTo(1, 0); arrowShape.lineTo(0.86, 0.1); arrowShape.lineTo(0.86, 0.035); arrowShape.lineTo(0, 0.035);
      const arrow = new THREE.Mesh(new THREE.ShapeGeometry(arrowShape), new THREE.MeshBasicMaterial({ color: COLORS.ink, depthTest: false, transparent: true }));
      arrow.renderOrder = 11;
      arrow.visible = false;
      const arrowPivot = new THREE.Group();
      arrowPivot.position.y = 0.03;
      arrowPivot.add(arrow);
      arrow.rotation.x = -Math.PI / 2;
      scene.add(arrowPivot);
      function setArrow(a, s) {
        arrow.visible = true;
        arrowPivot.rotation.y = -a;
        arrow.scale.set(mapR(s), 1, 1);
      }

      // ---------- Kamera ----------
      let camDist = 10;
      const shake = { amp: 0 };
      function resize() {
        renderer.setSize(innerWidth, innerHeight, false);
        camera.aspect = innerWidth / innerHeight;
        camDist = THREE.MathUtils.clamp(Math.max(9.5, 8.4 / camera.aspect), 9.5, 17);
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);
      resize();
      const toScreen = (v) => {
        const p = v.clone().project(camera);
        return { x: (p.x * 0.5 + 0.5) * innerWidth, y: (-p.y * 0.5 + 0.5) * innerHeight };
      };

      // ---------- Ton & Sprache ----------
      let speechOn = false, actx = null;
      const ensureAudio = () => {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === "suspended") actx.resume();
      };
      function tone(type, f0, f1, dur, vol) {
        if (!actx) return;
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
        o.type = type;
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(actx.destination);
        o.start(t);
        o.stop(t + dur);
      }
      const sfx = {
        push: (s) => tone("triangle", 160, 120, 0.15, 0.08 + 0.1 * (s / MAX_S)),
        lost: () => tone("sine", 660, 330, 0.4, 0.08),
        thud: () => tone("sine", 100, 38, 0.45, 0.45),
        ding: () => tone("sine", 880, 880, 0.5, 0.08),
      };
      let voice = null;
      const pickVoice = () => {
        const vs = speechSynthesis.getVoices();
        voice = vs.find((v) => v.lang === "de-DE" && /Google|Markus|Yannick|Anna/.test(v.name)) || vs.find((v) => v.lang.startsWith("de")) || null;
      };
      if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
      function speak(text) {
        if (!speechOn || !("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/[–:]/g, ","));
        u.lang = "de-DE";
        if (voice) u.voice = voice;
        speechSynthesis.speak(u);
      }
      const soundBtn = document.getElementById("sound");
      soundBtn.addEventListener("click", () => {
        speechOn = !speechOn;
        soundBtn.textContent = speechOn ? "🔊" : "🔇";
        if (speechOn) speak(sayEl.textContent);
        else if ("speechSynthesis" in window) speechSynthesis.cancel();
      });

      // ---------- UI ----------
      const $ = (s) => document.querySelector(s);
      const sayEl = $("#say"), card = $("#card"), metaEl = $("#meta"), forceTag = $("#forceTag");
      const a1 = $("#a1"), a2 = $("#a2"), tagLine = $("#tagLine"), tagLeg = $("#tagLeg");
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const pct = (s) => Math.round((s / MAX_S) * 100);

      function say(html) {
        gsap.killTweensOf(sayEl);
        gsap.to(sayEl, {
          opacity: 0, duration: 0.15,
          onComplete: () => {
            sayEl.innerHTML = html;
            gsap.fromTo(sayEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" });
          },
        });
        speak(html.replace(/<[^>]+>/g, ""));
      }
      const meta = (html) => (metaEl.innerHTML = html);

      function setButtons(primary, secondary) {
        for (const [btn, cfg] of [[a1, primary], [a2, secondary]]) {
          if (!cfg) { btn.style.pointerEvents = "none"; gsap.to(btn, { opacity: 0, duration: 0.2 }); btn.onclick = null; continue; }
          btn.textContent = cfg.label;
          btn.onclick = cfg.onClick;
          btn.style.pointerEvents = "auto";
          gsap.to(btn, { opacity: 1, duration: 0.3, delay: 0.15 });
        }
      }

      function showCard({ k = "", title = "", text = "", button, onClick }) {
        card.querySelector(".k").textContent = k;
        const h1 = card.querySelector("h1");
        h1.textContent = title;
        h1.classList.toggle("long", title.length > 22);
        card.querySelector("p").textContent = text;
        const btn = card.querySelector("button");
        btn.textContent = button;
        btn.onclick = () => {
          ensureAudio();
          card.style.pointerEvents = "none";
          gsap.to(card, { opacity: 0, duration: 0.3, onComplete: onClick });
        };
        card.style.pointerEvents = "auto";
        gsap.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.4 });
        gsap.fromTo(h1, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" });
        speak([title, text].filter(Boolean).join(". "));
      }
      function showTags(on) { gsap.to([tagLine, tagLeg], { opacity: on ? 1 : 0, duration: 0.4 }); }

      // ---------- Eingabe: von irgendwo in eine Richtung ziehen ----------
      const raycaster = new THREE.Raycaster();
      const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      const ndc = new THREE.Vector2();
      function groundPoint(e) {
        ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
        raycaster.setFromCamera(ndc, camera);
        const p = new THREE.Vector3();
        return raycaster.ray.intersectPlane(ground, p) ? p : null;
      }
      let allowInput = false, drag = null;
      canvas.addEventListener("pointerdown", (e) => {
        ensureAudio();
        if (!allowInput || phys.fallen || phys.frozen) return;
        const p = groundPoint(e);
        if (p) drag = { start: p, a: 0, s: 0 };
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!drag) return;
        const p = groundPoint(e);
        if (!p) return;
        const dx = p.x - drag.start.x, dz = p.z - drag.start.z;
        drag.s = Math.min(MAX_S, Math.hypot(dx, dz) * DRAG_TO_S);
        drag.a = Math.atan2(dz, dx);
        if (drag.s > 0.05) {
          setArrow(drag.a, drag.s);
          forceTag.textContent = `Kraft ${pct(drag.s)} %`;
          forceTag.style.left = e.clientX + "px";
          forceTag.style.top = e.clientY + "px";
          forceTag.style.opacity = 1;
        }
      });
      const endDrag = () => {
        if (!drag) return;
        const d = drag;
        drag = null;
        arrow.visible = false;
        forceTag.style.opacity = 0;
        if (d.s < 0.08 || !allowInput) return;
        doPush(d.a, d.s);
      };
      function doPush(a, s) {
        if (!allowInput || phys.fallen || phys.frozen) return;
        const attempt = { a, s, min: minForce(Math.cos(a), Math.sin(a)) };
        pending = { ...attempt, t: performance.now() };
        push(Math.cos(a), Math.sin(a), s);
        hooks.onPush?.(attempt);
      }
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);

      // Ergebnis eines Schubses: gefallen oder wieder ruhig
      const hooks = {};
      let pending = null;
      function checkPending() {
        if (!pending) return;
        if (phys.fallen) { const p = pending; pending = null; hooks.onResult?.({ ...p, fell: true }); }
        else if (phys.phi === 0 && phys.w === 0 && performance.now() - pending.t > 300) { const p = pending; pending = null; hooks.onResult?.({ ...p, fell: false }); }
      }
      hooks.onLost = () => {
        sfx.lost();
        gsap.timeline().to(phys, { timeScale: 0.3, duration: 0.1 }).to(phys, { timeScale: 1, duration: 0.7, delay: 0.3 });
      };

      // ---------- Die Journey ----------
      const flow = {
        start() {
          showCard({ k: "Grappling · Erwachsene", title: "Das dritte Bein", text: "Finde die Richtung, in die er am leichtesten fällt.", button: "Beginnen", onClick: flow.explore });
        },

        // 1) Erkunden: in verschiedene Richtungen schieben
        explore() {
          say("Zieh in eine Richtung – die Länge ist deine Kraft.");
          meta("Versuche <b>0</b> · Richtung und Kraft frei");
          allowInput = true;
          let n = 0;
          hooks.onPush = null;
          hooks.onResult = async (r) => {
            n++;
            addMark(r.a, r.s, r.fell);
            meta(`Versuche <b>${n}</b> · zuletzt ${pct(r.s)} % ${r.fell ? "→ gefallen" : "→ steht"}`);
            if (r.fell) { await wait(900); await standUp(); }
            if (n === 1) say(r.fell ? "Gefallen. Ginge es mit <em>weniger</em> Kraft?" : "Er steht. Probier eine andere Richtung.");
            if (n === 3) say("Wo hat er keinen Fuß?");
            if (n >= 5) {
              allowInput = false;
              showCard({ k: "Frage", title: "Wo ist er schwach?", button: "Kraftkarte zeigen", onClick: flow.reveal });
            }
          };
        },

        // 2) Kraftkarte + Stativ-Erklärung
        async reveal() {
          if (phys.fallen) await standUp(0.5);
          revealMap(true, 2.2);
          say("Rot: die kleinste Kraft, die ihn in jede Richtung wirft.");
          meta(`Leichteste Richtung: <b>${pct(bestForce())} %</b> · schwerste: <b>${pct(Math.max(...forceMap.map((m) => m.s)))} %</b>`);
          await wait(3800);
          buildTripod();
          tripod.visible = true;
          showTags(true);
          gsap.from(dashMat, { opacity: 0, duration: 0.8 });
          say("Die tiefen Täler liegen <em>senkrecht</em> zur Linie seiner Füße – dort fehlt das dritte Bein.");
          setButtons({ label: "Weiter", onClick: () => { setButtons(); flow.challengeIntro(); } });
        },

        challengeIntro() {
          showTags(false);
          tripod.visible = false;
          revealMap(false);
          clearMarks();
          showCard({ k: "Challenge", title: "Drei Stellungen. Ein Schubs.", text: "Lies seine Füße und wirf ihn mit so wenig Kraft wie möglich.", button: "Los", onClick: flow.challenge });
        },

        // 3) Challenge: wechselnde Stellungen, Effizienz = Minimum / eingesetzt
        async challenge() {
          const scores = [];
          for (let round = 0; round < 3; round++) {
            await newStance(randomStance(stance.yaw));
            say(round === 0 ? "Lies die Füße. Dann ein Schubs." : round === 1 ? "Neue Stellung." : "Letzte Stellung.");
            meta(`Stellung <b>${round + 1}/3</b> · Bestwert hier ${pct(bestForce())} %`);
            let total = 0;
            const result = await new Promise((resolve) => {
              allowInput = true;
              hooks.onPush = null;
              hooks.onResult = async (r) => {
                total += r.s;
                addMark(r.a, r.s, r.fell);
                if (!r.fell) { say(`Steht noch – ${pct(r.s)} % reichten nicht.`); return; }
                allowInput = false;
                resolve(r);
              };
            });
            const eff = Math.round((bestForce() / total) * 100);
            scores.push(eff);
            sfx.ding();
            revealMap(true, 0.9);
            say(`Effizienz <em>${eff} %</em>${eff >= 80 ? " – sauber gelesen." : eff >= 50 ? " – fast im Tal." : " – zu viel Kraft oder falscher Winkel."}`);
            meta(`Stellung <b>${round + 1}/3</b> · eingesetzt ${pct(total)} % · möglich ${pct(bestForce())} %`);
            await wait(2600);
            revealMap(false);
            clearMarks();
            await standUp();
          }
          const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
          meta(`Ø Effizienz <b>${avg} %</b> · ${scores.map((s) => s + " %").join(" · ")}`);
          flow.end(avg);
        },

        end(avg) {
          showCard({
            k: `Merksatz · Ø Effizienz ${avg} %`,
            title: "Wirf ihn dorthin, wo kein Fuß steht.",
            text: "Im Drill: Fußlinie des Partners lesen, im rechten Winkel dazu brechen – 10× pro Seite.",
            button: "Freies Training",
            onClick: flow.free,
          });
        },

        // Freies Training mit Karte an/aus und neuer Stellung
        free() {
          say("Freies Training.");
          meta("Ziehen = schieben · Karte und Stellung unten");
          allowInput = true;
          let mapOn = false;
          const buttons = () => setButtons(
            { label: "Neue Stellung", onClick: async () => { allowInput = false; clearMarks(); if (phys.fallen) await standUp(0.5); await newStance(randomStance(stance.yaw)); if (mapOn) revealMap(true, 0.8); allowInput = true; } },
            { label: mapOn ? "Karte aus" : "Karte an", onClick: () => { mapOn = !mapOn; revealMap(mapOn, 0.8); buttons(); } }
          );
          buttons();
          hooks.onResult = async (r) => {
            addMark(r.a, r.s, r.fell);
            meta(`${pct(r.s)} % ${r.fell ? "→ gefallen" : "→ steht"} · Minimum in dieser Richtung ${pct(r.min)} %`);
            if (r.fell) { await wait(900); await standUp(); }
          };
        },
      };

      // ---------- Animationsschleife ----------
      const clock = new THREE.Clock();
      function tick() {
        const dt = Math.min(clock.getDelta(), 1 / 30);
        stepPhysics(dt * phys.timeScale);
        checkPending();
        applyStance();
        updateFigure();
        updateIndicator();

        shake.amp *= Math.exp(-dt * 6);
        camera.position.set((Math.random() - 0.5) * shake.amp, 0.9 * camDist + (Math.random() - 0.5) * shake.amp, 0.52 * camDist);
        camera.lookAt(camLook);

        // Beschriftungen an Fußlinie und drittes Bein heften
        if (feetWorld.length) {
          const [a, b] = feetWorld;
          const [near, far] = a[1] > b[1] ? [a, b] : [b, a];
          const p = toScreen(new THREE.Vector3(near[0] + (near[0] - far[0]) * 0.9, 0, near[1] + (near[1] - far[1]) * 0.9));
          tagLine.style.left = p.x + "px";
          tagLine.style.top = p.y + "px";
          const q = toScreen(legPoints[0]);
          tagLeg.style.left = q.x + "px";
          tagLeg.style.top = q.y + 26 + "px";
        }
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      updateHull();
      drawHull();
      computeMap();
      tick();
      flow.start();

      // Zum Testen in der Konsole
      window.drittesBein = { phys, stance, push, doPush, bestForce, minForce, forceMap: () => forceMap, flow, rayEdge, hull: () => hull };
    </script>
  </body>
</html>

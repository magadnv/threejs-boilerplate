    <style>
      /* ---------- Farben & Grundlagen (wie „Der Fels“ und „Fallschule“) ---------- */
      :root {
        --bg: #fff3e3;
        --ink: #2b1b17;
        --red: #cf1830;
        --white: #ffffff;
        --ok: #1db954;
        --out: #e5243b;
        --gold: #ffd23f;
        --soft: #e7d3bd;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--ink);
        font-family: "Fredoka", system-ui, sans-serif;
        user-select: none; -webkit-user-select: none;
        touch-action: none; overscroll-behavior: none;
      }
      canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      button { font-family: inherit; cursor: pointer; border: 0; }

      /* ---------- Modus-Umschalter ---------- */
      .modes {
        position: fixed; left: 50%; top: calc(12px + var(--safe-top)); transform: translateX(-50%); z-index: 6;
        display: flex; padding: 5px; border-radius: 999px; background: var(--white); box-shadow: 0 3px 0 var(--soft);
      }
      .modes a { padding: 8px 14px; border-radius: 999px; font-size: 17px; font-weight: 600; color: #8a6a55; text-decoration: none; white-space: nowrap; }
      .modes a[aria-current="page"] { background: var(--red); color: var(--white); }

      /* ---------- Satz oben ---------- */
      #say {
        position: fixed; left: 16px; right: 16px; top: calc(76px + var(--safe-top));
        text-align: center; font-weight: 700; line-height: 1.1;
        font-size: clamp(28px, 6vw, 52px); pointer-events: none; text-wrap: balance;
      }
      #stars {
        position: fixed; left: 50%; top: calc(76px + var(--safe-top) + clamp(40px, 8vw, 70px));
        transform: translateX(-50%); display: flex; gap: 10px;
        font-size: clamp(30px, 6vw, 44px); pointer-events: none; opacity: 0;
      }
      #stars span { color: var(--soft); display: inline-block; }
      #stars span.on { color: var(--gold); text-shadow: 0 2px 0 #c99a00; }

      /* ---------- Knöpfe ---------- */
      .btn {
        background: var(--red); color: var(--white); font-weight: 700;
        font-size: clamp(24px, 4.5vw, 34px); padding: 18px 44px; border-radius: 999px;
        box-shadow: 0 6px 0 #8f0f20, 0 14px 30px rgba(207, 24, 48, 0.3); transition: transform 0.12s;
      }
      .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8f0f20; }
      #action { position: fixed; left: 50%; bottom: calc(28px + var(--safe-bottom)); transform: translateX(-50%); opacity: 0; pointer-events: none; z-index: 3; }
      .round {
        position: fixed; top: calc(14px + var(--safe-top)); height: 52px; border-radius: 999px; background: var(--white);
        box-shadow: 0 3px 0 var(--soft); z-index: 5; font-size: 18px; font-weight: 700; color: var(--ink);
      }
      #sound { right: calc(14px + env(safe-area-inset-right, 0px)); width: 52px; font-size: 24px; }
      #levelBtn { left: calc(14px + env(safe-area-inset-left, 0px)); padding: 0 18px; }

      /* ---------- Karte ---------- */
      #card {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 4;
        background: rgba(255, 243, 227, 0.78); backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none;
      }
      #card .inner { text-align: center; padding: 16px; max-width: 980px; }
      #card h1 { margin: 0 0 10px; font-weight: 700; line-height: 1; white-space: pre-line; font-size: clamp(44px, 10vw, 96px); color: var(--red); text-wrap: balance; }
      #card h1.long { font-size: clamp(34px, 6.4vw, 68px); }
      #card p { margin: 0 0 30px; font-weight: 600; line-height: 1.15; font-size: clamp(24px, 4.6vw, 40px); text-wrap: balance; }
      #card .seal { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 50%; border: 6px solid var(--red); display: grid; place-items: center; font-size: 48px; background: var(--white); }
      #card .seal[hidden], #card .btn[hidden], #card .levels[hidden], #card .topics[hidden] { display: none; }
      #card .btn.alt { background: var(--white); color: var(--red); box-shadow: 0 6px 0 var(--soft); margin-left: 12px; }
      #card .levels { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
      #card .levels button { width: min(172px, 40vw); padding: 20px 10px; border-radius: 28px; background: var(--white); box-shadow: 0 6px 0 var(--soft); color: var(--ink); }
      #card .levels button b { display: block; font-size: clamp(22px, 4vw, 30px); color: var(--red); }
      #card .levels button span { font-size: clamp(16px, 2.6vw, 20px); font-weight: 600; }
      #card .topics { display: flex; gap: 10px; justify-content: center; margin: -6px 0 22px; flex-wrap: wrap; }
      #card .topics a, #card .topics span { padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 19px; text-decoration: none; background: var(--white); color: #8a6a55; box-shadow: 0 3px 0 var(--soft); }
      #card .topics span { background: var(--red); color: var(--white); box-shadow: none; }

      /* ---------- Brücken-Knöpfe (unten) ---------- */
      #bridges { position: fixed; left: 50%; bottom: calc(22px + var(--safe-bottom)); transform: translateX(-50%); display: flex; gap: 12px; z-index: 3; }
      .bridge, .feet {
        width: clamp(84px, 17vw, 124px); padding: 12px 6px 10px; border-radius: 24px; background: var(--white);
        box-shadow: 0 6px 0 var(--soft); color: var(--ink); text-align: center; display: none;
      }
      .bridge.show, .feet.show { display: block; }
      .bridge i, .feet i { display: block; font-style: normal; font-size: clamp(30px, 6vw, 42px); line-height: 1.1; color: var(--red); font-weight: 700; }
      .bridge b, .feet b { display: block; font-size: clamp(15px, 2.8vw, 20px); }
      .feet.on { background: var(--ok); color: var(--white); box-shadow: 0 6px 0 #138a3e; }
      .feet.on i { color: var(--white); }
      .bridge.on { background: var(--ok); color: var(--white); box-shadow: 0 6px 0 #138a3e; }
      .bridge.on i { color: var(--white); }
      .bridge:active, .feet:active { transform: translateY(4px); }
      /* Bo kündigt die Brücke an: großer Pfeil zur Seite */
      #warn { position: fixed; top: 46%; font-size: clamp(70px, 14vw, 130px); font-weight: 700; color: var(--red); opacity: 0; pointer-events: none; z-index: 2; transform: translate(-50%, -50%); text-shadow: 0 6px 0 rgba(143, 15, 32, 0.25); }
      .pulse { animation: pulse 0.9s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(1.12); } }

      /* ---------- „Fest!“-Punkte auf Bos Arm und Fuß ---------- */
      .grab {
        position: fixed; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%;
        background: var(--white); border: 4px dashed var(--red); color: var(--red);
        font-weight: 700; font-size: 15px; line-height: 1; display: none; place-items: center; z-index: 2;
      }
      .grab.show { display: grid; }
      .grab.on { background: var(--red); color: var(--white); border-style: solid; }
      .grab.pulse { animation: pulse 0.9s ease-in-out infinite; }

      .tag { position: fixed; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 22px; background: var(--white); pointer-events: none; opacity: 0; transform: translate(-50%, -50%); box-shadow: 0 3px 0 rgba(0,0,0,0.08); white-space: nowrap; z-index: 2; }
      .tag.bad { background: var(--out); color: var(--white); }
      .tag.good { background: var(--ok); color: var(--white); }
    </style>
  </head>

    <!-- Frei-Punkte: erscheinen, wenn Bo deinen Arm oder Fuß einfängt -->

    <button class="grab" data-part="foot" data-side="1">Fuß<br />frei!</button>

    <div id="tagPost" class="tag good">abgestützt!</div>

    <div id="card"><div class="inner">
      <div class="seal" hidden>🏔️</div>
      <h1></h1>
      <div class="topics" hidden><a href="../12-fels/">🪨 Stehen</a><a href="../15-fallschule/">🤸 Fallen</a><a href="../16-bruecke/">🌉 Unten raus</a><a href="../17-hueftflucht/">🦐 Hüfte raus</a><span>🏔️ Oben bleiben</span></div>
      <p></p>
      <div class="levels" hidden>
        <button data-level="1"><b>Level 1</b><span>Tief bleiben</span></button>
        <button data-level="2"><b>Level 2</b><span>Knie breit</span></button>
        <button data-level="3"><b>Level 3</b><span>Hand abstützen</span></button>
        <button data-level="4"><b>Level 4</b><span>Arm frei</span></button>

      </div>

    <script type="module">
      import * as THREE from "three";

      /* =====================================================================
         OBEN BLEIBEN · Kinder (Thema 5: die Umkehrung von „Die Brücke“)
         Du sitzt auf Bo (Mount). Bo brückt – und du bleibst oben.

         Physik – derselbe Kippblock, jetzt kippst DU:
         - Deine Fläche reicht zur Seite bis zu deinen Knien: eng b = 0.5, breit b = 0.8.
           Stützt du die Hand auf der Seite ab: b = 1.15. Fängt Bo deinen Fuß ein,
           bleibt das Knie auf der Seite eng; fängt er deinen Arm, kannst du dich dort
           nicht abstützen.
         - Bos Brücke gibt dir einen Drehimpuls:  ω₀ = K · f · h / (b² + h²)
           f = wie viel deines Gewichts auf seiner Hüfte liegt (nur die hebt er an):
               aufrecht f = 1, tief mit Brust auf Brust f = 0.5
           h = deine Schwerpunkt-Höhe: aufrecht 1.25, tief 0.85
         - Bo wird von Level zu Level stärker (K = 2.6 · 4.6 · 7.6 · 7.6 · 7.6).
           Vorab in Node gerechnet: Jedes Level geht nur mit dem, was es lehrt.
         ===================================================================== */

      // ---------- Einstellungen ----------
      const G = 9.81;
      const B_NARROW = 0.5, B_WIDE = 0.8, B_POST = 1.15;
      const H_UP = 1.25, H_LOW = 0.85, F_UP = 1, F_LOW = 0.5;
      const K_LEVEL = { 1: 2.6, 2: 4.6, 3: 7.6, 4: 7.6, 5: 7.6 };
      const B_KNEE = B_NARROW; // (für die Grundhaltung)
      const COLORS = {
        bg: 0xfff3e3, mat: 0xf9b233, matBorder: 0xcf1830, gi: 0xffffff,
        kid: 0xff8a3d, kidBelt: 0x2bb673, bo: 0x14b8a6, boBelt: 0xff6b00, gold: 0xffd23f, red: 0xcf1830,
      };

      // ---------- Renderer, Szene, Kamera ----------
      const canvas = document.getElementById("scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(COLORS.bg);
      scene.fog = new THREE.Fog(COLORS.bg, 16, 32);
      const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
      const camLook = new THREE.Vector3(0, 0.75, -0.1);
      const shake = { amp: 0 };

      scene.add(new THREE.HemisphereLight(0xfff8ee, 0xf2a65a, 1.6));
      const sun = new THREE.DirectionalLight(0xffffff, 2.2);
      sun.position.set(-4, 9, 5);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 25 });
      sun.shadow.radius = 6;
      scene.add(sun);

      const mat = new THREE.Mesh(new THREE.BoxGeometry(14, 0.3, 12), new THREE.MeshStandardMaterial({ color: COLORS.matBorder, roughness: 0.9 }));
      mat.position.y = -0.15;
      mat.receiveShadow = true;
      scene.add(mat);
      const matInner = new THREE.Mesh(new THREE.PlaneGeometry(12, 10), new THREE.MeshStandardMaterial({ color: COLORS.mat, roughness: 0.95 }));
      matInner.rotation.x = -Math.PI / 2;
      matInner.position.y = 0.001;
      matInner.receiveShadow = true;
      scene.add(matInner);

      // ---------- Bausteine ----------
      const toon = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, flatShading: true });
      const mGi = toon(COLORS.gi), mKid = toon(COLORS.kid), mKidBelt = toon(COLORS.kidBelt), mBo = toon(COLORS.bo), mBoBelt = toon(COLORS.boBelt);
      const mDark = new THREE.MeshBasicMaterial({ color: 0x1a1a1a }), mCheek = new THREE.MeshBasicMaterial({ color: 0xff8fa3 });
      const ico = (r, d = 1) => new THREE.IcosahedronGeometry(r, d);
      const shadowy = (m) => ((m.castShadow = true), m);
      const limbGeo = new THREE.CylinderGeometry(1, 1, 1, 8);
      const UP = new THREE.Vector3(0, 1, 0), tmpV = new THREE.Vector3();
      function limb(mat, r) { const m = shadowy(new THREE.Mesh(limbGeo, mat)); m.userData.r = r; return m; }
      function placeLimb(mesh, a, b) {
        mesh.position.copy(a).add(b).multiplyScalar(0.5);
        tmpV.copy(b).sub(a);
        mesh.scale.set(mesh.userData.r, tmpV.length(), mesh.userData.r);
        mesh.quaternion.setFromUnitVectors(UP, tmpV.normalize());
      }
      function face(headGroup, headMat, r) {
        headGroup.add(shadowy(new THREE.Mesh(ico(r, 2), headMat)));
        for (const s of [-1, 1]) {
          const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), mDark);
          eye.position.set(s * 0.13, 0.05, r * 0.92);
          headGroup.add(eye);
          const cheek = new THREE.Mesh(new THREE.CircleGeometry(0.055, 12), mCheek);
          cheek.position.set(s * 0.23, -0.07, r * 0.82);
          cheek.rotation.y = s * 0.55;
          headGroup.add(cheek);
        }
        const smile = new THREE.Mesh(new THREE.TorusGeometry(0.065, 0.016, 6, 12, Math.PI), mDark);
        smile.position.set(0, -0.07, r * 0.95);
        smile.rotation.z = Math.PI;
        headGroup.add(smile);
      }

      /* ---------- Du: liegst auf dem Rücken, Kopf zur Kamera (+z), Knie hoch ----------
         bot.hip = Hüfthöhe (Brücke hebt sie), bot.roll = Drehung zur Brücken-Seite */
      const bot = { hip: 0, roll: 0, feet: 1, sitUp: 0 }; // feet: 1 = am Po, 0 = weit weg
      const botRoot = new THREE.Group();
      scene.add(botRoot);
      const botBody = new THREE.Group(); // dreht sich bei der Brücke um die Längsachse
      botRoot.add(botBody);
      const botTorso = shadowy(new THREE.Mesh(ico(1, 2), mGi));
      botTorso.scale.set(0.55, 0.3, 0.62);
      botBody.add(botTorso);
      const botBeltM = shadowy(new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.06, 6, 18), mKidBelt));
      botBeltM.scale.set(1.05, 1, 0.6);
      botBody.add(botBeltM);
      const botHead = new THREE.Group();
      face(botHead, mKid, 0.38);
      botHead.rotation.x = -Math.PI / 2 + 0.25; // schaut nach oben
      botBody.add(botHead);
      const botArms = [-1, 1].map((s) => ({ s, upper: limb(mGi, 0.1), hand: shadowy(new THREE.Mesh(ico(0.11, 1), mKid)) }));
      const botLegs = [-1, 1].map((s) => ({ s, thigh: limb(mGi, 0.13), shin: limb(mGi, 0.11), knee: shadowy(new THREE.Mesh(ico(0.13, 1), mGi)), foot: shadowy(new THREE.Mesh(ico(1, 1), mKid)) }));
      botArms.forEach((a) => botRoot.add(a.upper, a.hand));
      botLegs.forEach((L) => { L.foot.scale.set(0.13, 0.09, 0.24); botRoot.add(L.thigh, L.shin, L.knee, L.foot); });

      /* ---------- Bo: kniet auf dir, schaut zur Kamera ----------
         topRoot wird über eine Matrix um seine Kippkante gedreht (wie bei „Der Fels“). */
      const topRoot = new THREE.Group();
      topRoot.matrixAutoUpdate = false;
      scene.add(topRoot);
      const topUpper = new THREE.Group();
      topRoot.add(topUpper);
      const topTorso = shadowy(new THREE.Mesh(ico(1, 2), mGi));
      topTorso.scale.set(0.58, 0.6, 0.46);
      topTorso.position.y = 0.42;
      topUpper.add(topTorso);
      const topBeltM = shadowy(new THREE.Mesh(new THREE.TorusGeometry(0.53, 0.07, 6, 18), mBoBelt));
      topBeltM.rotation.x = Math.PI / 2;
      topBeltM.scale.set(1, 0.82, 1);
      topBeltM.position.y = 0.18;
      topUpper.add(topBeltM);
      const topHead = new THREE.Group();
      topHead.position.y = 1.15;
      face(topHead, mBo, 0.4);
      topUpper.add(topHead);
      const topArms = [-1, 1].map((s) => ({ s, upper: limb(mGi, 0.11), lower: limb(mGi, 0.1), hand: shadowy(new THREE.Mesh(ico(0.12, 1), mBo)), post: 0 }));
      const topLegs = [-1, 1].map((s) => ({ s, thigh: limb(mGi, 0.15), shin: limb(mGi, 0.13), knee: shadowy(new THREE.Mesh(ico(0.15, 1), mGi)), foot: shadowy(new THREE.Mesh(ico(1, 1), mBo)), step: 0 }));
      topArms.forEach((a) => topRoot.add(a.upper, a.lower, a.hand));
      topLegs.forEach((L) => { L.foot.scale.set(0.13, 0.09, 0.22); topRoot.add(L.thigh, L.shin, L.knee, L.foot); });
      // „Fest“-Griffe: deine Hand auf seinem Arm / dein Fuß an seinem Fuß
      const grabMarks = {};
      for (const k of ["arm-1", "arm1", "foot-1", "foot1"]) {
        const m = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.045, 8, 20), new THREE.MeshStandardMaterial({ color: COLORS.red, emissive: COLORS.red, emissiveIntensity: 0.5 }));
        m.visible = false;
        scene.add(m);
        grabMarks[k] = m;
      }

      // ---------- Deine Haltung (oben): tief/aufrecht, Knie eng/breit, Hand abgestützt ----------
      // me.low: 0 = aufrecht, 1 = tief (Brust nach vorne auf Bo); L.step je Bein: 0 = Knie eng, 1 = breit
      const me = { hipY: 0.95, lean: 0, bounce: 0, low: 0, wide: 0 };
      const topLocal = { // in deinem eigenen Rahmen (vor dem Kippen); x = links/rechts, z = zur Kamera
        knee: (s, step) => new THREE.Vector3(s * (B_NARROW + step * (B_WIDE - B_NARROW)), 0.13, 0.05),
        foot: (s, step) => new THREE.Vector3(s * (0.42 + step * 0.3), 0.08, -0.75),
        shoulder: (s) => new THREE.Vector3(s * 0.5, me.hipY + 0.72, 0.05),
        handRest: (s) => new THREE.Vector3(s * 0.28, me.hipY + 0.05 - me.low * 0.25, 0.45 + me.low * 0.25),
        handPost: (s) => new THREE.Vector3(s * B_POST, 0.1, 0.55),
      };
      const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
      function applyTop() {
        me.hipY = 0.95 - me.low * 0.22;
        topUpper.position.y = me.hipY + me.bounce;
        topUpper.rotation.x = me.low * 0.75; // tief: Brust nach vorne auf Bos Brust
        for (const L of topLegs) {
          const hip = vA.set(L.s * 0.22, me.hipY, 0);
          const knee = topLocal.knee(L.s, L.step), foot = topLocal.foot(L.s, L.step);
          placeLimb(L.thigh, hip, knee);
          placeLimb(L.shin, knee, foot);
          L.knee.position.copy(knee);
          L.foot.position.copy(foot);
        }
        for (const a of topArms) {
          const sh = topLocal.shoulder(a.s);
          const hand = vB.copy(topLocal.handRest(a.s)).lerp(topLocal.handPost(a.s), a.post);
          const elbow = vC.copy(sh).lerp(hand, 0.5).add(new THREE.Vector3(a.s * 0.18, 0.05, -0.05));
          placeLimb(a.upper, sh, elbow);
          placeLimb(a.lower, elbow, hand);
          a.hand.position.copy(hand);
        }
      }

      // Du: Hüfte heben (Brücke), zur Seite drehen, Füße ran/weg, am Ende aufsitzen
      function applyBot() {
        const hip = 0.32 + bot.hip;
        botBody.position.set(0, hip, 0.35);
        // Brücke: Hüfte hoch, Kopf/Schultern bleiben unten; am Ende aufsitzen
        botBody.rotation.set(-0.08 + bot.hip * 0.6 - bot.sitUp * 0.9, 0, -bot.roll * 0.5);
        botHead.position.set(0, 0.05, 0.95);
        botBeltM.position.set(0, 0, -0.35);
        botBeltM.rotation.set(Math.PI / 2, 0, 0);
        // Arme: liegen neben dir oder greifen Bos Arm
        for (const a of botArms) {
          const sh = vA.set(a.s * 0.5, hip + 0.05, 0.85);
          const trapped = grabs[`arm${a.s}`];
          const target = trapped ? topArmWorld(a.s) : vB.set(a.s * 0.9, 0.1, 0.55);
          placeLimb(a.upper, sh, target);
          a.hand.position.copy(target);
        }
        // Beine: Knie hoch, Füße am Po (feet = 1) oder weit weg
        const footZ = THREE.MathUtils.lerp(-1.55, -0.95, bot.feet);
        for (const L of botLegs) {
          const hipJ = vA.set(L.s * 0.25, hip - 0.05, -0.2);
          const trapped = grabs[`foot${L.s}`];
          const foot = trapped ? topFootWorld(L.s).add(new THREE.Vector3(L.s * 0.25, 0, 0)) : vB.set(L.s * 0.45, 0.1, footZ);
          const mid = vC.copy(hipJ).add(foot).multiplyScalar(0.5);
          const d = hipJ.distanceTo(foot);
          const knee = mid.clone().add(new THREE.Vector3(L.s * 0.1, 1, 0).normalize().multiplyScalar(Math.sqrt(Math.max(0.02, 0.78 * 0.78 - (d / 2) ** 2))));
          placeLimb(L.thigh, hipJ, knee);
          placeLimb(L.shin, knee, foot);
          L.knee.position.copy(knee);
          L.foot.position.copy(foot);
        }
      }
      // Welt-Positionen von Bos Arm/Fuß (für die Griffe)
      const topArmWorld = (s) => topArms[s > 0 ? 1 : 0].lower.getWorldPosition(new THREE.Vector3());
      const topFootWorld = (s) => topLegs[s > 0 ? 1 : 0].foot.getWorldPosition(new THREE.Vector3());

      // ---------- Physik: Du kippst zur Seite ----------
      const tip = { phi: 0, w: 0, side: 0, t: 0, rolled: false, frozen: false, timeScale: 1, b: B_NARROW };
      const grabs = { "arm-1": false, arm1: false, "foot-1": false, foot1: false }; // was Bo von dir gefangen hat
      const based = { "post-1": false, post1: false };                              // wo deine Hand auf der Matte ist
      let level = 1;

      const isLow = () => me.low > 0.5;
      const isWide = () => me.wide > 0.5;
      const comH = () => (isLow() ? H_LOW : H_UP);
      // Deine Fläche zur Seite s: Knie (eng/breit – gefangener Fuß bleibt eng), Hand abgestützt
      function baseTo(s) {
        const knee = isWide() && !grabs[`foot${s}`] ? B_WIDE : B_NARROW;
        return Math.max(knee, based[`post${s}`] ? B_POST : 0);
      }

      // Bo brückt zur Seite s
      let pendingBridge = null;
      function bridge(s) {
        if (tip.frozen || tip.rolled || tip.phi !== 0) return;
        const h = comH(), b = baseTo(s), f = isLow() ? F_LOW : F_UP;
        tip.side = s;
        tip.t = 0;
        tip.w = (K_LEVEL[level] * f * h) / (b * b + h * h);
        gsap.timeline()
          .to(bot, { hip: 0.4, roll: s, duration: 0.18, ease: "power2.out" })
          .to(bot, { hip: 0, roll: 0, duration: 0.5, ease: "power2.inOut" });
        gsap.fromTo(me, { bounce: 0.18 * f }, { bounce: 0, duration: 0.5, ease: "bounce.out" });
        sfx.bridge(1);
        pendingBridge = { side: s };
      }

      function stepTip(dt) {
        if (tip.frozen || tip.rolled || (tip.phi === 0 && tip.w === 0)) return;
        const n = Math.ceil(dt / (1 / 300));
        for (let i = 0; i < n; i++) {
          const h = comH();
          tip.t += dt / n;
          // Fläche zur Kipp-Seite – eine abgestützte Hand zählt sofort
          tip.b = tip.phi > 0.02 ? baseTo(tip.side) : B_NARROW;
          const b = tip.b, R = Math.hypot(b, h), alpha = Math.atan2(b, h), p2 = (3 * G) / (4 * R);
          tip.w += -p2 * Math.sin(alpha - tip.phi) * (dt / n);
          tip.w *= 1 - 0.8 * (dt / n);
          tip.phi += tip.w * (dt / n);
          if (tip.phi <= 0) { tip.phi = 0; tip.w = 0; squash(); resolveBridge(false); return; }
          if (tip.phi >= 1.25) { tip.phi = 1.25; tip.w = 0; tip.rolled = true; resolveBridge(true); return; }
        }
      }

      // ---------- Deine Matrix: um die Kante deiner Fläche kippen ----------
      const mA = new THREE.Matrix4(), mB = new THREE.Matrix4(), mC = new THREE.Matrix4(), mBase = new THREE.Matrix4();
      function updateTopMatrix() {
        // Du sitzt auf Bos Bauch: Grundposition (Knie auf der Matte)
        mBase.makeTranslation(0, 0, 0.15);
        if (tip.phi === 0) { topRoot.matrix.copy(mBase); }
        else {
          const px = tip.side * tip.b;
          topRoot.matrix.copy(mBase)
            .multiply(mA.makeTranslation(px, 0, 0))
            .multiply(mB.makeRotationZ(-tip.side * tip.phi))
            .multiply(mC.makeTranslation(-px, 0, 0));
        }
        topRoot.matrixWorldNeedsUpdate = true;
      }
      function squash() { gsap.fromTo(topUpper.scale, { x: 1.1, y: 0.9, z: 1.1 }, { x: 1, y: 1, z: 1, duration: 0.6, ease: "elastic.out(1, 0.4)" }); }

      // ---------- Kamera ----------
      let camDist = 8;
      function resize() {
        renderer.setSize(innerWidth, innerHeight, false);
        camera.aspect = innerWidth / innerHeight;
        camDist = THREE.MathUtils.clamp(Math.max(8.4, 7.4 / camera.aspect), 8.4, 15);
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);
      resize();
      const toScreen = (v) => { const p = v.clone().project(camera); return { x: (p.x * 0.5 + 0.5) * innerWidth, y: (-p.y * 0.5 + 0.5) * innerHeight }; };

      // ---------- Ton & Sprache ----------
      let soundOn = true, actx = null;
      const ensureAudio = () => { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); };
      function tone(type, f0, f1, dur, vol) {
        if (!soundOn || !actx) return;
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
        o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
      }
      const sfx = {
        bridge: (f) => tone("sine", 140, 260 + 140 * f, 0.25, 0.25),
        post: () => tone("triangle", 300, 200, 0.12, 0.14),
        grab: () => tone("triangle", 520, 780, 0.12, 0.12),
        roll: () => { tone("sine", 200, 60, 0.6, 0.35); setTimeout(() => tone("sine", 110, 40, 0.4, 0.3), 250); },
        tick: () => tone("triangle", 660, 660, 0.12, 0.12),
        ding: () => { tone("triangle", 880, 880, 0.35, 0.16); setTimeout(() => tone("triangle", 1320, 1320, 0.4, 0.12), 90); },
      };
      let voice = null;
      const pickVoice = () => { const vs = speechSynthesis.getVoices(); voice = vs.find((v) => v.lang === "de-DE" && /Anna|Petra|Helena|Google/.test(v.name)) || vs.find((v) => v.lang.startsWith("de")) || null; };
      if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
      function speak(text) {
        if (!soundOn || !("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/[–=]/g, ","));
        u.lang = "de-DE"; if (voice) u.voice = voice; u.rate = 0.95; u.pitch = 1.1;
        speechSynthesis.speak(u);
      }
      const soundBtn = document.getElementById("sound");
      soundBtn.addEventListener("click", () => { soundOn = !soundOn; soundBtn.textContent = soundOn ? "🔊" : "🔇"; if (!soundOn && "speechSynthesis" in window) speechSynthesis.cancel(); });

      // ---------- UI ----------
      const $ = (s) => document.querySelector(s);
      const sayEl = $("#say"), actionBtn = $("#action"), card = $("#card");
      const tagPost = $("#tagPost"), tagStep = $("#tagStep"), tagTop = $("#tagTop");
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      function say(text) {
        gsap.killTweensOf(sayEl);
        gsap.to(sayEl, { y: -10, opacity: 0, duration: 0.15, onComplete: () => { sayEl.textContent = text; gsap.fromTo(sayEl, { y: 16, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }); } });
        speak(text);
      }
      function showAction(label, onClick) {
        actionBtn.textContent = label;
        actionBtn.onclick = () => { hideAction(); onClick(); };
        actionBtn.style.pointerEvents = "auto";
        gsap.fromTo(actionBtn, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)", delay: 0.3 });
      }
      function hideAction() { actionBtn.style.pointerEvents = "none"; actionBtn.onclick = null; gsap.to(actionBtn, { opacity: 0, y: 20, duration: 0.2 }); }
      function showCard({ title = "", text = "", button, onClick, button2, onClick2, seal = false, sealIcon = "🌉", levels, topics = false }) {
        const h1 = card.querySelector("h1");
        h1.textContent = title;
        h1.classList.toggle("long", title.length > 26);
        card.querySelector("p").textContent = text;
        card.querySelector(".seal").hidden = !seal;
        card.querySelector(".seal").textContent = sealIcon;
        card.querySelector(".topics").hidden = !topics;
        const close = (fn) => () => { ensureAudio(); card.style.pointerEvents = "none"; gsap.to(card, { opacity: 0, duration: 0.3, onComplete: fn }); };
        const btn = card.querySelector(".btn.main"), alt = card.querySelector(".btn.alt");
        btn.hidden = !button; btn.textContent = button || ""; btn.onclick = close(onClick);
        alt.hidden = !button2; alt.textContent = button2 || ""; alt.onclick = close(onClick2);
        const lv = card.querySelector(".levels");
        lv.hidden = !levels;
        lv.querySelectorAll("button").forEach((b) => (b.onclick = close(() => levels(+b.dataset.level))));
        card.style.pointerEvents = "auto";
        gsap.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.35 });
        gsap.fromTo(card.querySelector(".inner"), { y: 40, scale: 0.94 }, { y: 0, scale: 1, duration: 0.6, ease: "back.out(1.8)" });
        speak([title, text].filter(Boolean).join(" "));
      }
      const starEls = [...document.querySelectorAll("#stars span")];
      function setStars(n, pop = -1) {
        starEls.forEach((s, i) => s.classList.toggle("on", i < n));
        if (pop >= 0) gsap.fromTo(starEls[pop], { scale: 0.3, rotate: -90 }, { scale: 1, rotate: 0, duration: 0.6, ease: "back.out(3)" });
      }
      const tagTargets = new Map();
      function flashTag(el, obj, lift = 0.4) {
        tagTargets.set(el, { obj, lift });
        gsap.killTweensOf(el);
        gsap.timeline().fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }).to(el, { opacity: 0, duration: 0.4, delay: 1.6 });
      }

      // ---------- Knöpfe: Tief, Knie breit, Hand links/rechts; Frei-Punkte ----------
      const moveEls = Object.fromEntries([...document.querySelectorAll("#bridges [data-move]")].map((b) => [b.dataset.move, b]));
      const grabEls = [...document.querySelectorAll(".grab")];
      const warnEl = $("#warn");
      let inputOpen = false, onResult = null, allowed = [];
      function setControls(list = [], pulse = null) {
        allowed = list;
        for (const [k, el] of Object.entries(moveEls)) {
          el.classList.toggle("show", list.includes(k));
          el.classList.toggle("pulse", k === pulse);
        }
        moveEls.low.classList.toggle("on", isLow());
        moveEls.wide.classList.toggle("on", isWide());
        moveEls["post-1"].classList.toggle("on", based["post-1"]);
        moveEls.post1.classList.toggle("on", based.post1);
        // Frei-Punkte nur dort, wo Bo gerade etwas gefangen hat
        grabEls.forEach((el) => el.classList.toggle("show", !!grabs[`${el.dataset.part}${el.dataset.side}`]));
      }
      function doMove(k) {
        if (k === "low") gsap.to(me, { low: isLow() ? 0 : 1, duration: 0.3, overwrite: "auto" });
        if (k === "wide") {
          const w = isWide() ? 0 : 1;
          me.wide = w; // Physik sofort, Beine gleiten hinterher
          topLegs.forEach((L) => !grabs[`foot${L.s}`] && gsap.to(L, { step: w, duration: 0.3, overwrite: "auto" }));
        }
        if (k === "post-1" || k === "post1") {
          const s = k === "post1" ? 1 : -1;
          if (grabs[`arm${s}`]) { say("Dein Arm ist gefangen – erst befreien!"); return; }
          // nur eine Hand auf einmal: die andere kommt zurück
          based[`post${s}`] = true;
          based[`post${-s}`] = false;
          topArms.forEach((a) => gsap.to(a, { post: a.s === s ? 1 : 0, duration: 0.12, overwrite: "auto" }));
          sfx.post();
        }
        sfx.grab();
        setControls(allowed);
      }
      for (const [k, el] of Object.entries(moveEls)) {
        el.addEventListener("click", () => {
          ensureAudio();
          if (!inputOpen || tip.rolled) return;
          el.classList.remove("pulse");
          doMove(k);
        });
      }
      // Bo fängt etwas ein / du befreist es
      function setGrab(key, on) {
        grabs[key] = on;
        if (key.startsWith("arm") && on) {
          const s = +key.slice(3);
          based[`post${s}`] = false;
          gsap.to(topArms[s > 0 ? 1 : 0], { post: 0, duration: 0.2 });
        }
        if (key.startsWith("foot")) {
          const s = +key.slice(4);
          gsap.to(topLegs[s > 0 ? 1 : 0], { step: on ? 0 : me.wide, duration: 0.25 });
        }
        if (on) { flashTag(tagStep, key.startsWith("arm") ? topArms[+key.slice(3) > 0 ? 1 : 0].hand : topLegs[+key.slice(4) > 0 ? 1 : 0].foot); sfx.post(); }
        setControls(allowed);
      }
      grabEls.forEach((el) => el.addEventListener("click", () => {
        ensureAudio();
        if (!inputOpen || tip.rolled) return;
        setGrab(`${el.dataset.part}${el.dataset.side}`, false);
        sfx.grab();
      }));
      function resolveBridge(rolled) {
        const p = pendingBridge;
        pendingBridge = null;
        if (rolled) { sfx.roll(); shake.amp = 0.18; flashTag(tagTop, topHead, 0.5); }
        else if (based[`post${p?.side}`]) flashTag(tagPost, topArms[p.side > 0 ? 1 : 0].hand, 0.3);
        onResult?.({ rolled, ...(p || {}) });
      }
      // Bo kündigt die Brücke an: Pfeil zur Seite
      function warn(s, on) {
        warnEl.textContent = s > 0 ? "➜" : "⬅";
        warnEl.style.left = (s > 0 ? 72 : 28) + "%";
        gsap.to(warnEl, { opacity: on ? 1 : 0, duration: on ? 0.15 : 0.3 });
        if (on) gsap.fromTo(warnEl, { x: 0 }, { x: s * 30, duration: 0.3, repeat: 3, yoyo: true });
      }

      // ---------- Zurücksetzen ----------
      function resetScene(n = 1) {
        level = n;
        gsap.killTweensOf([tip, bot, me, ...topArms, ...topLegs]);
        Object.assign(tip, { phi: 0, w: 0, side: 0, t: 0, rolled: false, frozen: false, b: B_NARROW });
        Object.assign(bot, { hip: 0, roll: 0, sitUp: 0, feet: 1 });
        Object.assign(me, { low: 0, wide: 0, bounce: 0 });
        topArms.forEach((a) => (a.post = 0));
        topLegs.forEach((L) => (L.step = 0));
        Object.keys(based).forEach((k) => (based[k] = false));
        Object.keys(grabs).forEach((k) => (grabs[k] = false));
        inputOpen = false;
        onResult = null;
        warn(1, false);
        hideAction();
      }
      // Zurück in die Ausgangslage; preset: welche Haltung schon gelernt ist
      function standUp(preset = {}) {
        return new Promise((resolve) => {
          tip.frozen = true;
          Object.keys(grabs).forEach((k) => (grabs[k] = false));
          Object.keys(based).forEach((k) => (based[k] = false));
          gsap.to(bot, { sitUp: 0, hip: 0, roll: 0, duration: 0.6 });
          const low = preset.low ? 1 : 0, wide = preset.wide ? 1 : 0;
          gsap.to(me, { low, duration: 0.5 });
          me.wide = wide;
          topLegs.forEach((L) => gsap.to(L, { step: wide, duration: 0.5 }));
          topArms.forEach((a) => gsap.to(a, { post: 0, duration: 0.5 }));
          gsap.to(tip, {
            phi: 0, duration: 0.8, ease: "power2.inOut",
            onComplete: () => { Object.assign(tip, { w: 0, rolled: false, frozen: false }); setControls(allowed); resolve(); },
          });
        });
      }

      // ---------- Ein Versuch: Bo fängt (vielleicht) etwas ein, kündigt an, brückt ----------
      // plan: { trap: "arm"|"foot"|null, warnMs, side? }
      async function attempt(plan, { auto = null } = {}) {
        inputOpen = !auto;
        const side = plan.side ?? (Math.random() < 0.5 ? -1 : 1);
        await wait(plan.startMs ?? 1500);
        if (plan.trap) { setGrab(`${plan.trap}${side}`, true); await wait(plan.trapMs ?? 1800); }
        // Kluger Bo: brückt zur Seite, auf der keine Hand steht
        let s = side;
        if (!plan.trap && based[`post${s}`]) s = -s;
        warn(s, true);
        sfx.tick();
        const resP = new Promise((resolve) => (onResult = resolve));
        if (auto) auto(s);
        await wait(plan.warnMs ?? 900);
        warn(s, false);
        bridge(s);
        const r = await resP;
        inputOpen = false;
        return r;
      }

      // ---------- Die Level ----------
      // preset: was aus früheren Levels schon „an“ ist; moves: welche Knöpfe es gibt
      const LEVELS = {
        1: {
          icon: "⬇", moves: ["low"], preset: {},
          intro: "Du sitzt auf Bo. Kannst du oben bleiben?",
          plan: { warnMs: 1100 },
          probe: { say: "Aufrecht – Bo wirft dich runter!" },
          question: "Wie bleibst du oben?",
          explain: { say: "Tief – Brust auf seine Brust! Dann hebt seine Brücke dich kaum.", act: () => doMove("low") },
          practice: "Mach dich tief, bevor Bo brückt!",
          fail: () => "Zu aufrecht – drück „Tief“!",
          title: "Tief bleiben – Brust auf Brust!",
          task: "Üb mit deinem Trainer: Brust nach vorne, Hüfte schwer – und er brückt!",
        },
        2: {
          icon: "↔", moves: ["low", "wide"], preset: { low: true },
          intro: "Bo ist jetzt stärker!",
          plan: { warnMs: 1100 },
          probe: { say: "Knie zu eng – du kippst trotzdem!" },
          question: "Was macht dich noch stabiler?",
          explain: { say: "Knie breit – dann ist deine Fläche breit!", act: () => doMove("wide") },
          practice: "Tief und Knie breit!",
          fail: () => (!isLow() ? "Tief bleiben!" : "Knie breit!"),
          title: "Tief und Knie breit!",
          task: "Zeig deinem Trainer: tief und breit oben sitzen – wie ein Fels!",
        },
        3: {
          icon: "✋", moves: ["low", "wide", "post-1", "post1"], preset: { low: true, wide: true },
          intro: "Bo brückt jetzt richtig stark!",
          plan: { warnMs: 1000 },
          probe: { say: "Zu stark – ohne Hand kippst du!" },
          question: "Was fängt dich auf?",
          explain: { say: "Wohin Bo brückt, da kommt deine Hand auf die Matte!", act: (s) => setTimeout(() => doMove(s > 0 ? "post1" : "post-1"), 350) },
          practice: "Schau auf den Pfeil – Hand auf die Seite!",
          fail: (r) => (based[`post${-r.side}`] ? "Falsche Seite – die Hand dahin, wohin der Pfeil zeigt!" : "Zu spät – Hand schneller auf die Matte!"),
          title: "Hand auf die Seite, wohin er brückt!",
          task: "Üb mit deinem Trainer: Er brückt – du stützt die Hand auf der Seite ab!",
        },
        4: {
          icon: "💪", moves: ["low", "wide", "post-1", "post1"], preset: { low: true, wide: true },
          intro: "Bo fängt jetzt deinen Arm ein!",
          plan: { trap: "arm", warnMs: 1000 },
          probe: { say: "Arm gefangen – du konntest dich nicht abstützen!" },
          question: "Was musst du zuerst tun?",
          explain: { say: "Arm frei – dann Hand auf die Matte!", act: (s) => { setTimeout(() => setGrab(`arm${s}`, false), 150); setTimeout(() => doMove(s > 0 ? "post1" : "post-1"), 450); } },
          practice: "Arm frei – und Hand auf die Matte!",
          fail: (r) => (grabs[`arm${r.side}`] ? "Erst den Arm befreien!" : "Hand auf die Seite, wohin er brückt!"),
          title: "Lass dir den Arm nicht fangen!",
          task: "Üb mit deinem Trainer: Er greift deinen Arm – du ziehst ihn raus!",
        },
        5: {
          icon: "🏔️", moves: ["low", "wide", "post-1", "post1"], preset: {},
          intro: "Bo fängt mal Arm, mal Fuß – und brückt schnell!",
          plan: () => ({ trap: Math.random() < 0.5 ? "arm" : "foot", warnMs: 750, startMs: 2200, trapMs: 1600 }),
          practice: "Tief, breit, befreien, Hand auf die Matte!",
          fail: (r) => (!isLow() ? "Tief bleiben!" : !isWide() ? "Knie breit!" : grabs[`arm${r.side}`] || grabs[`foot${r.side}`] ? "Erst befreien!" : "Hand auf die Seite, wohin er brückt!"),
          title: "Tief, breit, frei – und abstützen!",
          task: "Zeig deinem Trainer, wie du oben bleibst – egal was er macht!",
        },
      };
      const planOf = (L) => (typeof L.plan === "function" ? L.plan() : L.plan);

      const flow = {
        start() {
          resetScene();
          setControls([]);
          showCard({ seal: true, sealIcon: "🏔️", title: "Oben bleiben", topics: true, text: "Welches Level übst du?", levels: (n) => flow.level(n) });
        },

        level(n) {
          const L = LEVELS[n];
          resetScene(n);
          setControls([]);
          showCard({ seal: true, sealIcon: L.icon, title: `Level ${n}`, text: L.intro, button: "Los!", onClick: async () => { await standUp(L.preset); n === 5 ? flow.practice(n, 0) : flow.probe(n); } });
        },

        // Probe: ohne das Neue – du fliegst runter
        async probe(n) {
          const L = LEVELS[n];
          setControls(L.moves);
          say("Schau zu!");
          await attempt({ ...planOf(L), side: 1 }, { auto: () => {} });
          await wait(600);
          say(L.probe.say);
          await wait(2000);
          showCard({ title: L.question, button: "Zeig's mir", onClick: () => flow.explain(n) });
        },

        // Zeitlupe: so bleibst du oben
        async explain(n) {
          const L = LEVELS[n];
          await standUp(L.preset);
          say(L.explain.say);
          await wait(1200);
          tip.timeScale = 0.45;
          await attempt({ ...planOf(L), side: 1, startMs: 600 }, { auto: L.explain.act });
          tip.timeScale = 1;
          await wait(1200);
          showAction("Jetzt du!", async () => { await standUp(L.preset); flow.practice(n, 0); });
        },

        async practice(n, round, stars = 0, tries = 0) {
          const L = LEVELS[n];
          setControls(L.moves, round === 0 && tries === 0 ? L.moves.at(n >= 3 ? -1 : -1) : null);
          gsap.to("#stars", { opacity: 1, duration: 0.3 });
          setStars(stars);
          if (tries === 0) say(round === 0 ? L.practice : ["", "Nochmal!", "Letzte Runde!"][round]);
          const r = await attempt(planOf(L));
          await wait(700);
          if (!r.rolled) {
            stars += tries === 0 ? 1 : 0;
            setStars(stars, tries === 0 ? stars - 1 : -1);
            sfx.ding();
            say(tries === 0 ? "Oben geblieben!" : "Geschafft!");
            await wait(1600);
            await standUp(L.preset);
            if (round < 2) flow.practice(n, round + 1, stars, 0);
            else flow.end(n, stars);
          } else {
            say(L.fail(r));
            await wait(1800);
            await standUp(L.preset);
            flow.practice(n, round, stars, tries + 1);
          }
        },

        end(n, stars) {
          const L = LEVELS[n];
          gsap.to("#stars", { opacity: 0, duration: 0.3 });
          setControls([]);
          showCard({
            seal: true, sealIcon: L.icon, title: L.title, text: L.task,
            button: n < 5 ? `Level ${n + 1}!` : "Nochmal", onClick: () => flow.level(n < 5 ? n + 1 : 5),
            button2: stars < 2 ? "Nochmal üben" : "Level wählen", onClick2: stars < 2 ? () => flow.level(n) : flow.start,
          });
        },
      };
      // Level-Knopf lädt neu: so läuft keine angefangene Runde im Hintergrund weiter
      $("#levelBtn").addEventListener("click", () => location.reload());

      // ---------- Animationsschleife ----------
      const clock = new THREE.Clock();
      const grabPos = { "arm-1": () => topArmWorld(-1), arm1: () => topArmWorld(1), "foot-1": () => topFootWorld(-1), foot1: () => topFootWorld(1) };
      function tick() {
        const dt = Math.min(clock.getDelta(), 1 / 30);
        applyTop();
        stepTip(dt * tip.timeScale);
        updateTopMatrix();
        topRoot.updateMatrixWorld(true);
        applyBot();

        // Kamera: von deinem Kopf aus auf Bo, wackelt beim Runterrollen
        shake.amp *= Math.exp(-dt * 7);
        camera.position.set((Math.random() - 0.5) * shake.amp, 0.62 * camDist + (Math.random() - 0.5) * shake.amp, 0.78 * camDist);
        camera.lookAt(camLook);

        // Fest-Punkte und Griff-Ringe an Bos Arm/Fuß heften
        for (const el of grabEls) {
          const key = `${el.dataset.part}${el.dataset.side}`;
          const s = +el.dataset.side;
          const p = grabPos[key]();
          // Knopf gut erreichbar: Arm am Ellbogen außen, Fuß unten neben Bos Knie
          const anchor = el.dataset.part === "arm" ? topArms[s > 0 ? 1 : 0].upper.getWorldPosition(vB) : topLegs[s > 0 ? 1 : 0].knee.getWorldPosition(vB);
          const sp = toScreen(anchor);
          el.style.left = sp.x + s * (el.dataset.part === "arm" ? 46 : 70) + "px";
          el.style.top = sp.y + (el.dataset.part === "arm" ? -10 : 34) + "px";
          const ring = grabMarks[key];
          ring.visible = grabs[key];
          ring.position.copy(p);
          ring.lookAt(camera.position);
        }
        for (const [el, { obj, lift }] of tagTargets) {
          obj.getWorldPosition(vA);
          vA.y += lift;
          const p = toScreen(vA);
          el.style.left = p.x + "px";
          el.style.top = p.y + "px";
        }
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
      flow.start();

      // Zum Testen in der Konsole
      window.obenbleiben = { tip, bot, me, grabs, based, bridge, setGrab, doMove, flow, LEVELS, topArms, topLegs, open: () => inputOpen };
    </script>
  </body>
</html>
